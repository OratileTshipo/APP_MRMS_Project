name: CI

# Runs on every push and pull request to any branch. Keeps the unpacked
# canvas-app source honest without requiring pac / .NET: the screen registry
# guard fails fast when a screen file and _EditorState drift apart, and the
# Power Fx verifier catches unbalanced formulas, dangling navigation targets,
# duplicate control names and invalid Patch keys.

on:
  push:
  pull_request:

jobs:
  verify-source:
    name: Verify unpacked source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Screen registry check (src/Src vs _EditorState)
        run: python3 tools/check_screen_registry.py

      - name: Power Fx static verification
        run: python3 tools/verify_powerfx.py
