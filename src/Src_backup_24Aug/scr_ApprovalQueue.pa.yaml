Screens:
  scr_ApprovalQueue:
    Properties:
      Fill: =varBgLight
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =
        // scr_ApprovalQueue.OnVisible
        // Purpose: reset screen-local state (tab, filters, selection,
        // comment), then load the role-scoped review queue via the hidden
        // ApprQueueRefresh_btn (which also recomputes the tab counts and
        // preselects the first item). Roles: Administrator / DeputyDirectorME
        // see everything, ProgrammeManager sees their programme, Supervisor
        // sees their directorate (DirectorateLabel stores the short code),
        // everyone else sees their own submissions.

        Set(varQueueTab, "Pending");
        Set(varQueueSearch, "");
        Set(varQueueFilterDirectorate, "All");
        Set(varQueueComment, "");
        Set(varQueueSelected, Blank());
        Select(ApprQueueRefresh_btn_1)
    Children:
      - ApprQueueMainScreen_con:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =App.Width
          Children:
            - ApprQueueNavRail:
                Control: CanvasComponent
                ComponentName: cmp_NavRail
                Properties:
                  ActiveScreen: ="scr_ApprovalQueue"
      - ApprQueueDetails_con:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =App.Width - ApprQueueNavRail.Width
            X: =40
          Children:
            - ApprQueueAppHeader:
                Control: CanvasComponent
                ComponentName: cmp_AppHeader
                Properties:
                  PageTitle: ="Approval Queue"
                  SearchHint: =
                  ShowBack: =false
                  ShowSearch: =false
                  Subtitle: =varQueuePendingCount & " report(s) awaiting review"
            - ApprQueueBody_con_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - ApprQueueAppHeader.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =14
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  Width: =Parent.Width
                Children:
                  - ApprQueueList_col_1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =Parent.Width * 0.38
                      Children:
                        - ApprQueueToolbar_con_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =46
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =6
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =6
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =Parent.Width
                            Children:
                              - ApprQueueSearch_ico_1:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Color: =RGBA(113, 111, 110, 1)
                                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                    DisabledColor: =RGBA(225, 223, 221, 1)
                                    DisabledFill: =RGBA(0, 0, 0, 0)
                                    FocusedBorderThickness: =4
                                    Height: =18
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverColor: =RGBA(16, 110, 190, 1)
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    Icon: =Icon.Search
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                                    PressedColor: =RGBA(16, 110, 190, 1)
                                    PressedFill: =RGBA(0, 0, 0, 0)
                                    Width: =18
                              - ApprQueueSearch_txt_1:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    BorderColor: =RGBA(214, 221, 224, 1)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: =Set(varQueueSearch, ApprQueueSearch_txt_1.Text)
                                    Placeholder: ="Search reports..."
                                    Width: =Parent.Width - 90
                              - ApprQueueDirectorate_drp_1:
                                  Control: ModernDropdown@1.0.2
                                  Properties:
                                    AccessibleLabel: ="Directorate"
                                    Fill: =varBgLight
                                    ItemDisplayText: =ThisItem.DirectorateID
                                    Items: =Directorates
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: =Set(varQueueFilterDirectorate, If(IsBlank(ApprQueueDirectorate_drp_1.Selected), "All", ApprQueueDirectorate_drp_1.Selected.DirectorateID))
                                    Width: =86
                        - ApprQueueTabs_con_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =34
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =Parent.Width
                            Children:
                              - ApprQueueTabPending_con_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =If(varQueueTab = "Pending", varNavy, RGBA(225, 229, 236, 1))
                                    BorderThickness: =1
                                    Fill: =If(varQueueTab = "Pending", varNavy, RGBA(255, 255, 255, 1))
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    RadiusBottomLeft: =20
                                    RadiusBottomRight: =20
                                    RadiusTopLeft: =20
                                    RadiusTopRight: =20
                                    Width: =Parent.Width / 3 - 6
                                  Children:
                                    - ApprQueueTabPending_lbl_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =If(varQueueTab = "Pending", RGBA(255, 255, 255, 1), RGBA(95, 100, 114, 1))
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Set(varQueueTab, "Pending")
                                          Size: =11.5
                                          Text: ="Pending (" & varQueuePendingCount & ")"
                                          Width: =Parent.Width
                              - ApprQueueTabOverdue_con_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =If(varQueueTab = "Overdue", varNavy, RGBA(225, 229, 236, 1))
                                    BorderThickness: =1
                                    Fill: =If(varQueueTab = "Overdue", varNavy, RGBA(255, 255, 255, 1))
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    RadiusBottomLeft: =20
                                    RadiusBottomRight: =20
                                    RadiusTopLeft: =20
                                    RadiusTopRight: =20
                                    Width: =Parent.Width / 3 - 6
                                  Children:
                                    - ApprQueueTabOverdue_lbl_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =If(varQueueTab = "Overdue", RGBA(255, 255, 255, 1), RGBA(95, 100, 114, 1))
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Set(varQueueTab, "Overdue")
                                          Size: =11.5
                                          Text: ="Overdue Review (" & varQueueOverdueCount & ")"
                                          Width: =Parent.Width
                              - ApprQueueTabEscalated_con_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =If(varQueueTab = "Escalated", varNavy, RGBA(225, 229, 236, 1))
                                    BorderThickness: =1
                                    Fill: =If(varQueueTab = "Escalated", varNavy, RGBA(255, 255, 255, 1))
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    RadiusBottomLeft: =20
                                    RadiusBottomRight: =20
                                    RadiusTopLeft: =20
                                    RadiusTopRight: =20
                                    Width: =Parent.Width / 3 - 6
                                  Children:
                                    - ApprQueueTabEscalated_lbl_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =If(varQueueTab = "Escalated", RGBA(255, 255, 255, 1), RGBA(95, 100, 114, 1))
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Set(varQueueTab, "Escalated")
                                          Size: =11.5
                                          Text: ="Escalated (" & varQueueEscalatedCount & ")"
                                          Width: =Parent.Width
                        - ApprQueueEmpty_lbl_1:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(113, 111, 110, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Text: ="No reports match this view."
                              Visible: =CountRows(ApprQueue_gal_1.AllItems) = 0
                              Width: =Parent.Width
                              Y: =120
                        - ApprQueue_gal_1:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              Height: =Parent.Height
                              Items: |-
                                =// ApprQueue_gal.Items — queue cards filtered by the active tab, the
                                // directorate dropdown and the search box. "Overdue" means a
                                // Submitted report that has waited more than 5 days for review.
                                Filter(
                                    colApprovalQueue,
                                    Switch(
                                        varQueueTab,
                                        "Pending", Status.Value = "Submitted",
                                        "Overdue", Status.Value = "Submitted" && DateDiff(SubmissionDate, Today(), TimeUnit.Days) > 5,
                                        "Escalated", Status.Value = "Escalated",
                                        true
                                    ) &&
                                    (varQueueFilterDirectorate = "All" || DirectorateLabel = varQueueFilterDirectorate) &&
                                    (
                                        IsBlank(varQueueSearch) ||
                                        Lower(Title) in Lower(varQueueSearch) ||
                                        Lower(Coalesce(Output, "")) in Lower(varQueueSearch)
                                    )
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: =Set(varQueueSelected, ThisItem)
                              TemplateSize: =118
                              Width: =Parent.Width
                            Children:
                              - ApprQueueCardBg_con:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =If(ThisItem.ID = varQueueSelected.ID, RGBA(46, 94, 170, 1), RGBA(225, 229, 236, 1))
                                    BorderThickness: =1
                                    Fill: =If(ThisItem.ID = varQueueSelected.ID, RGBA(46, 94, 170, 0.08), RGBA(255, 255, 255, 1))
                                    Height: =ApprQueue_gal_1.TemplateHeight - 8
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =ApprQueue_gal_1.TemplateWidth - 8
                              - ApprQueueRowTitle_lbl_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =RGBA(31, 39, 51, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =20
                                    OnSelect: =Select(Parent)
                                    Text: =Coalesce(ThisItem.Title, "")
                                    Width: =ApprQueue_gal_1.TemplateWidth - 120
                                    X: =1
                                    Y: =12
                              - ApprQueueRowOverdue_con_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =RGBA(251, 234, 232, 1)
                                    Height: =22
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    RadiusBottomLeft: =20
                                    RadiusBottomRight: =20
                                    RadiusTopLeft: =20
                                    RadiusTopRight: =20
                                    Visible: =DateDiff(Coalesce(SubmissionDate, Today()), Today(), TimeUnit.Days) > 5
                                    Width: =8
                                    Y: =11
                                  Children:
                                    - ApprQueueRowOverdue_lbl_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =RGBA(192, 57, 43, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =20
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Select(Parent)
                                          Size: =10.5
                                          Text: ="Overdue"
                                          Width: =Parent.Width
                              - ApprQueueRowSub_lbl_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =RGBA(113, 111, 110, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    Size: =11.5
                                    Text: |-
                                      =Coalesce(ThisItem.'Activity: ActivityShortDescription', ThisItem.Activity.Value, "")
                                    Width: =ApprQueue_gal_1.TemplateWidth - 40
                                    X: =1
                                    Y: =34
                              - ApprQueueRowMonth_lbl_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =RGBA(46, 94, 170, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: =Coalesce(ThisItem.ReportingMonth.Value, "") & " · " & Coalesce(ThisItem.'FinancialYear '.Value, "")
                                    Width: =ApprQueue_gal_1.TemplateWidth * 0.5
                                    X: =0.5
                                    Y: =56
                              - ApprQueueRowPct_lbl_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =RGBA(113, 111, 110, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    Height: =20
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: =Round(Coalesce(ThisItem.'PercentageComplete ', 0), 0) & "% complete"
                                    Width: =ApprQueue_gal_1.TemplateWidth * 0.35
                                    Y: =56
                              - ApprQueueRowFooter_lbl_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =RGBA(139, 147, 161, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    Size: =11
                                    Text: |-
                                      =Coalesce(ThisItem.SubmittedBy_x002f_SubmissionDate.DisplayName, "Unknown") & " · submitted " &
                                      If(
                                          DateDiff(Coalesce(SubmissionDate, Today()), Today(), TimeUnit.Days) = 0, "today",
                                          DateDiff(Coalesce(SubmissionDate, Today()), Today(), TimeUnit.Days) & " days ago"
                                      )
                                    Width: =ApprQueue_gal_1.TemplateWidth - 40
                                    X: =1
                                    Y: =80
                  - ApprQueueDetail_col_1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =Parent.Width * 0.62
                      Children:
                        - ApprQueueRefresh_btn_1:
                            Control: Button@0.0.45
                            Properties:
                              OnSelect: |-
                                =// Reload the role-scoped queue after an Approve / Reject / Return
                                // action, recompute the tab counts and re-select the first item.
                                ClearCollect(
                                    colApprovalQueue,
                                    Switch(
                                        varUserRole,
                                        "Administrator", Filter(MonthlyReports, Status.Value = "Submitted" || Status.Value = "Escalated"),
                                        "DeputyDirectorME", Filter(MonthlyReports, Status.Value = "Submitted" || Status.Value = "Escalated"),
                                        "ProgrammeManager", Filter(MonthlyReports, Status.Value = "Submitted" || Status.Value = "Escalated", ProgrammeLabel = varUserProgramme),
                                        "Supervisor", Filter(MonthlyReports, Status.Value = "Submitted" || Status.Value = "Escalated", DirectorateLabel = varUserDirectorate),
                                        Filter(MonthlyReports, Status.Value = "Submitted" || Status.Value = "Escalated", SubmittedBy.Email = varUserEmail)
                                    )
                                );
                                Set(varQueuePendingCount, CountRows(Filter(colApprovalQueue, Status.Value = "Submitted")));
                                Set(varQueueOverdueCount, CountRows(Filter(colApprovalQueue, Status.Value = "Submitted", DateDiff(SubmissionDate, Today(), TimeUnit.Days) > 5)));
                                Set(varQueueEscalatedCount, CountRows(Filter(colApprovalQueue, Status.Value = "Escalated")));
                                Set(varQueueSelected, If(CountRows(colApprovalQueue) > 0, First(colApprovalQueue), Blank()))
                              Text: =""
                              Visible: =false
                        - ApprQueueDetailHeader_con_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =96
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =14
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =14
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =14
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =Parent.Width
                            Children:
                              - ApprQueueDetailHeaderText_con_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Height: =Parent.Height
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Width: =Parent.Width
                                  Children:
                                    - ApprQueueDetailTitle_lbl_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =RGBA(31, 39, 51, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =22
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =15
                                          Text: =If(IsBlank(varQueueSelected), "Select a report", Coalesce(varQueueSelected.Title, ""))
                                          Width: =Parent.Width
                                    - ApprQueueDetailSub_lbl_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =RGBA(113, 111, 110, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =12
                                          Text: =If(IsBlank(varQueueSelected), "", Coalesce(varQueueSelected.ProgrammeLabel, "") & " · " & Coalesce(varQueueSelected.DirectorateLabel, "") & " · " & Coalesce(varQueueSelected.SubmittedBy_x002f_SubmissionDate.DisplayName, "Unknown"))
                                          Width: =Parent.Width
                              - ApprQueueDetailStatus_con_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =If(IsBlank(varQueueSelected) || varQueueSelected.Status.Value = "Submitted", RGBA(234, 241, 252, 1), RGBA(239, 234, 247, 1))
                                    Height: =30
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    RadiusBottomLeft: =20
                                    RadiusBottomRight: =20
                                    RadiusTopLeft: =20
                                    RadiusTopRight: =20
                                    Width: =110
                                  Children:
                                    - ApprQueueDetailStatus_lbl_1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =If(IsBlank(varQueueSelected) || varQueueSelected.Status.Value = "Submitted", RGBA(46, 94, 170, 1), RGBA(108, 79, 161, 1))
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =28
                                          LayoutMinHeight: =16
