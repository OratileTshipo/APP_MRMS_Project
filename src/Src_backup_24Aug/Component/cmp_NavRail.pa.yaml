# cmp_NavRail — reusable left navigation rail (sidebar).
#
# Replaces the hand-built sidebar containers (Sidebar_con / ProjectsSidebar_con /
# ActivitiesSidebar_con / …). Used on every screen; the active item highlight is
# driven by the ActiveScreen input (pass the current screen's name, e.g. "scr_Home").
#
# IMPORTANT: Components cannot call Navigate() directly. Navigation is handled via
# custom output properties that the parent screen's OnSelect handlers consume.
#
# Schema notes (import PA2108-safe):
#   - The component ROOT control only supports basic properties (Fill, Height,
#     Width, …). Auto-layout properties (LayoutDirection, LayoutGap, Padding*,
#     DropShadow) are NOT valid on the root — they live on the NavMain_con
#     GroupContainer child below.
#   - Custom properties are referenced from inside the component by the
#     component's own name (cmp_NavRail.ActiveScreen), which works at any
#     nesting depth (Microsoft's documented pattern).
#   - Parent.Width / Parent.Height refer to the immediate parent control only.
ComponentDefinitions:
  cmp_NavRail:
    DefinitionType: CanvasComponent
    Description: "Reusable left navigation rail with per-screen active-item highlight."
    AccessAppScope: true
    CustomProperties:
      ActiveScreen:
        PropertyKind: Input
        DataType: Text
        Description: "Name of the current screen (scr_Home, scr_Projects, ...) — drives the active icon highlight."
        Default: ="scr_Home"
      NavigateTo:
        PropertyKind: Output
        DataType: Text
        Description: "Returns the screen name to navigate to when an icon is clicked. Parent screen must call Navigate() in OnSelect."
    Properties:
      # Root control: basic properties only (schema-valid).
      Fill: =varBgLight
      Height: =App.Height
      Width: =App.Width * 0.05
    Children:
      - NavMain_con:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            # Auto-layout lives on this container, not the component root.
            DropShadow: =DropShadow.None
            Fill: =varBgLight
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =30
            PaddingBottom: =20
            PaddingLeft: =10
            PaddingRight: =10
            PaddingTop: =20
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - NavHome_ico:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Home"
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =If(cmp_NavRail.ActiveScreen = "scr_Home", varNavy, RGBA(0, 120, 212, 1))
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =Parent.Height / 20
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(16, 110, 190, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Home
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  # OUTPUT: Set NavigateTo to the target screen name
                  # Parent screen must handle: If(cmp_NavRail.NavigateTo = "scr_Home", Navigate(scr_Home))
                  OnSelect: =Set(varNavTarget, "scr_Home")
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(16, 110, 190, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Tooltip: ="Home"
                  Width: =Parent.Width - 20
            - NavProjects_ico:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Projects"
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =If(cmp_NavRail.ActiveScreen = "scr_Projects", varNavy, RGBA(0, 120, 212, 1))
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =Parent.Height / 20
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(16, 110, 190, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Manufacture
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Set(varNavTarget, "scr_Projects")
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(16, 110, 190, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Tooltip: ="Projects"
                  Width: =Parent.Width - 20
            - NavActivities_ico:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Activities"
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =If(cmp_NavRail.ActiveScreen = "scr_Activities", varNavy, RGBA(0, 120, 212, 1))
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =Parent.Height / 20
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(16, 110, 190, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Activity
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Set(varNavTarget, "scr_Activities")
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(16, 110, 190, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Tooltip: ="Activities"
                  Width: =Parent.Width - 20
            - NavMyActivities_ico:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="My Activities"
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =If(cmp_NavRail.ActiveScreen = "scr_MyActivities", varNavy, RGBA(0, 120, 212, 1))
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =Parent.Height / 20
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(16, 110, 190, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.User
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Set(varNavTarget, "scr_MyActivities")
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(16, 110, 190, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Tooltip: ="My Activities"
                  Width: =Parent.Width - 20
            - NavReports_ico:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Monthly Reports"
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =If(cmp_NavRail.ActiveScreen = "scr_Reports", varNavy, RGBA(0, 120, 212, 1))
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =Parent.Height / 20
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(16, 110, 190, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Document
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Set(varNavTarget, "scr_Reports")
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(16, 110, 190, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Tooltip: ="Monthly Reports"
                  Width: =Parent.Width - 20
            - NavUsers_ico:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Users"
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =If(cmp_NavRail.ActiveScreen = "scr_Users", varNavy, RGBA(0, 120, 212, 1))
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =Parent.Height / 20
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(16, 110, 190, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.People
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Set(varNavTarget, "scr_Users")
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(16, 110, 190, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Tooltip: ="Users"
                  Width: =Parent.Width - 20
