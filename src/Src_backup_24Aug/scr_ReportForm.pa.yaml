                                    BorderColor: =RGBA(214, 221, 224, 1)
                                    Default: =If(varReportMode = "New", "", varEditReport.Title)
                                    DisplayMode: =If(varReportMode = "View", DisplayMode.View, DisplayMode.Edit)
