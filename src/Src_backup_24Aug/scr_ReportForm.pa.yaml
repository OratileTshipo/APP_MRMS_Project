Screens:
  scr_ReportForm:
    Properties:
      Fill: =varBgLight
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =
        // scr_ReportForm.OnVisible
        // Purpose: resolve the selected activity and (optionally) an existing
        // report from the navigation context, then set the form mode.
        // Context params: selectedActivityID (Activities.ID), editReportID (MonthlyReports.ID, optional)

        Set(varReportMode, If(IsBlank(editReportID), "New", "Edit"));
        Set(varReportActivity, LookUp(colActivities, ID = selectedActivityID));
        Set(varEditReport, If(IsBlank(editReportID), Blank(), LookUp(MonthlyReports, ID = editReportID)))
    Children:
      - ReportForm_con:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =App.Width
          Children:
            - RepFormSidebar_con:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =varBgLight
                  FillPortions: =0
                  Height: =App.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =30
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =20
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =20
                  Width: =App.Width * 0.05
                Children:
                  - RepFormHome_ico:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Home"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(0, 120, 212, 1)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =Parent.Height / 20
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(16, 110, 190, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Home
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Navigate(scr_Home, ScreenTransition.Cover)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(16, 110, 190, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Home"
                        Width: =Parent.Width - 20
                  - RepFormProjects_ico:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Projects"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(0, 120, 212, 1)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =Parent.Height / 20
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(16, 110, 190, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Manufacture
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Navigate(scr_Projects, ScreenTransition.Cover)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(16, 110, 190, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Projects"
                        Width: =Parent.Width - 20
                  - RepFormActivities_ico:
