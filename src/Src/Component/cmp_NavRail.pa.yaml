# cmp_NavRail — reusable left navigation rail (sidebar).
#
# Replaces the hand-built sidebar containers (Sidebar_con / ProjectsSidebar_con /
# ActivitiesSidebar_con / …). Used on every screen; the active item highlight is
# driven by the ActiveScreen input (pass the current screen's name, e.g. "scr_Home").
# Navigation targets are fixed app-wide; the three footer icons (Trending/Settings/
# Support) stay decorative, matching the original app.
ComponentDefinitions:
  cmp_NavRail:
    DefinitionType: CanvasComponent
    Description: "Reusable left navigation rail with per-screen active-item highlight."
    AccessAppScope: true
    CustomProperties:
      ActiveScreen:
        PropertyKind: Input
        DataType: Text
        Description: "Name of the current screen (scr_Home, scr_Projects, ...) — drives the active icon highlight."
        Default: ="scr_Home"
    Properties:
      DropShadow: =DropShadow.None
      Fill: =varBgLight
      FillPortions: =0
      Height: =App.Height
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =30
      LayoutMinHeight: =16
      LayoutMinWidth: =16
      PaddingBottom: =20
      PaddingLeft: =10
      PaddingRight: =10
      PaddingTop: =20
      Width: =App.Width * 0.05
    Children:
      - NavHome_ico:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Home"
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =If(Parent.ActiveScreen = "scr_Home", varNavy, RGBA(0, 120, 212, 1))
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =Parent.Height / 20
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(16, 110, 190, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.Home
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            OnSelect: =Navigate(scr_Home, ScreenTransition.Cover)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(16, 110, 190, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            Tooltip: ="Home"
            Width: =Parent.Width - 20
      - NavProjects_ico:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Projects"
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =If(Parent.ActiveScreen = "scr_Projects", varNavy, RGBA(0, 120, 212, 1))
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =Parent.Height / 20
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(16, 110, 190, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.Manufacture
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            OnSelect: =Navigate(scr_Projects, ScreenTransition.Cover)
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(16, 110, 190, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            Tooltip: ="Projects"
            Width: =Parent.Width - 20
      - NavActivities_ico:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Activities"
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =If(Parent.ActiveScreen = "scr_Activities", varNavy, RGBA(0, 120, 212, 1))
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =Parent.Height / 20
