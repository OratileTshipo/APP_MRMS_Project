App:
  Properties:
    # ============================================================
    # NAMED FORMULAS (App.Formulas) — immutable, lazily evaluated.
    # Replaces the App.OnStart Set() calls for values that never
    # change after app load (theme, breakpoints, current user,
    # reporting period). Keeps OnStart small and the first screen fast.
    # ============================================================

    # 1. Theme colours
    varNavy: =ColorValue("#122952")
    varBlue: =ColorValue("#2E75B6")
    varLBlue: =ColorValue("#D9E6F2")
    varGrey: =ColorValue("#595959")
    varGreen: =ColorValue("#1E8A44")
    varAmber: =ColorValue("#E6A100")
    varRed: =ColorValue("#C0392B")
    varBgLight: =ColorValue("#F8F8F8")

    # 2. Responsive breakpoints (reactive — re-evaluate on resize)
    varIsMobile: =App.Width < 640
    varIsTablet: =App.Width >= 640 And App.Width < 1100

    # 3. Current user + derived role/scope
    varUserEmail: =User().Email
    varUserFullName: =User().FullName
    varCurrentUserRecord: =LookUp(APP_Users, UserAccount.Email = varUserEmail)
    varUserRole: =varCurrentUserRecord.Role.Value
    varUserDirectorate: =varCurrentUserRecord.Directorate.Value
    varUserProgramme: =varCurrentUserRecord.Programme.Value
    varUserDirectorateID: =LookUp(Directorates, Title = varUserDirectorate).DirectorateID
    varCanViewAllReports: =varUserRole = "DeputyDirectorME" || varUserRole = "Administrator"

    # 4. Reporting period defaults (derived from Today())
    varCurrentFY: =If(
        Month(Today()) >= 4,
        Year(Today()) & "/" & Right(Year(Today()) + 1, 2),
        Year(Today()) - 1 & "/" & Right(Year(Today()), 2)
    )
    varCurrentMonth: =Switch(Month(Today()),
        4, "April", 5, "May", 6, "June", 7, "July", 8, "August", 9, "September",
        10, "October", 11, "November", 12, "December", 1, "January", 2, "February", 3, "March")
    varCurrentQuarter: =Switch(true,
        Month(Today()) >= 4 And Month(Today()) <= 6, "Q1 (Apr-Jun)",
        Month(Today()) >= 7 And Month(Today()) <= 9, "Q2 (Jul-Sep)",
        Month(Today()) >= 10 And Month(Today()) <= 12, "Q3 (Oct-Dec)",
        "Q4 (Jan-Mar)")
    varTodaysDate: =DateValue(Today())

    # ============================================================
    # App.OnStart — only genuinely mutable state remains here.
    # ============================================================
    OnStart: |-
      =// 1. Filter defaults — mutated by screen controls (scr_Home, scr_Users, scr_MyActivities)
      Set(varHomeFilter, "All");
      Set(varHomeSearchTerm, "");
      Set(varFilterFY, "All");
      Set(varFilterProgramme, "All");
      Set(varFilterDirectorate, "All");
      Set(varFilterQuarter, "All");

      // 2. Reference data collections — mutable; screens re-collect these
      Concurrent(
          ClearCollect(colProgrammes, Filter(Programmes, Active = true)),
          ClearCollect(colProjects, Filter(Projects, Status.Value = "Active")),
          ClearCollect(colActivities, Filter(Activities, 'Active ' = true)),
          ClearCollect(colDirectorates, Filter(Directorates, Active = true))
      );

      // 3. Notifications — personal, rebuilt on scr_Home.OnVisible
      ClearCollect(
          colMyNotifications,
          Filter(Notifications, RecipientUser.Email = varUserEmail, IsRead = false)
      );
      Set(varUnreadCount, CountRows(colMyNotifications));

      // 4. UI state flags
      Set(varNavOpen, false);
      Set(varSidePanelOpen, false);
      Set(varFormIsValid, false);
    StartScreen: =scr_Splash
    Theme: =PowerAppsTheme
