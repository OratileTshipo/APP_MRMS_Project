Screens:
  scr_ApprovedReports:
    Properties:
      Fill: =varBgLight
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =
        // scr_ApprovedReports.OnVisible
        // Purpose: load the approved-reports scope (role-aware), reset the
        // screen-local filters, and compute the KPI card counts.
        // Replaces the former scr_Reports_1 duplicate — this screen is a
        // READ-ONLY dashboard: no edit form, no delete. Drill-down goes to
        // scr_ReportView (see the gallery OnSelect).

        // 1. Screen-local filter state — reset every visit
        Set(varApprFilterFY, "All");
        Set(varApprFilterProgramme, "All");
        Set(varApprFilterDirectorate, "All");
        Set(varApprFilterQuarter, "All");
        Set(varApprSearchTerm, "");

        // 2. Approved-reports scope — same role-first, single-column delegable
        //    pattern as scr_Home's colReportsInScope, restricted to Approved.
        //    MonthlyReports.DirectorateLabel stores the SHORT CODE (e.g. "ICTM"),
        //    so Supervisor matches on varUserDirectorate.
        ClearCollect(
            colApprovedReports,
            Switch(
                varUserRole,
                "Administrator", Filter(MonthlyReports, ReportStatus.Value = "Approved"),
                "DeputyDirectorME", Filter(MonthlyReports, ReportStatus.Value = "Approved"),
                "ProgrammeManager", Filter(MonthlyReports, ReportStatus.Value = "Approved", ProgrammeLabel = varUserProgramme),
                "Supervisor", Filter(MonthlyReports, ReportStatus.Value = "Approved", DirectorateLabel = varUserDirectorate),
                Filter(MonthlyReports, ReportStatus.Value = "Approved", SubmittedBy.Email = varUserEmail)
            )
        );

        // 3. KPI card counts
        Set(varApprovedTotal, CountRows(colApprovedReports));
        Set(
            varApprovedThisMonth,
            CountRows(Filter(colApprovedReports, ReportingMonth.Value = varCurrentMonth, 'FinancialYear '.Value = varCurrentFY))
        );
        Set(
            varApprovedThisFY,
            CountRows(Filter(colApprovedReports, 'FinancialYear '.Value = varCurrentFY))
        )
