Screens:
  scr_ApprovedReports:
    Properties:
      Fill: =varBgLight
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =
        // scr_ApprovedReports.OnVisible
        // Purpose: load the approved-reports scope (role-aware), reset the
        // screen-local filters, and compute the KPI card counts.
        // Replaces the former scr_Reports_1 duplicate — this screen is a
        // READ-ONLY dashboard: no edit form, no delete. Drill-down goes to
        // scr_ReportView (see the gallery OnSelect).

        // 1. Screen-local filter state — reset every visit
        Set(varApprFilterFY, "All");
        Set(varApprFilterProgramme, "All");
        Set(varApprFilterDirectorate, "All");
        Set(varApprFilterQuarter, "All");
        Set(varApprSearchTerm, "");

        // 2. Approved-reports scope — same role-first, single-column delegable
        //    pattern as scr_Home's colReportsInScope, restricted to Approved.
        //    MonthlyReports.DirectorateLabel stores the SHORT CODE (e.g. "ICTM"),
        //    so Supervisor matches on varUserDirectorateID.
        ClearCollect(
            colApprovedReports,
            Switch(
                varUserRole,
                "Administrator", Filter(MonthlyReports, Status.Value = "Approved"),
                "DeputyDirectorME", Filter(MonthlyReports, Status.Value = "Approved"),
                "ProgrammeManager", Filter(MonthlyReports, Status.Value = "Approved", ProgrammeLabel = varUserProgramme),
                "Supervisor", Filter(MonthlyReports, Status.Value = "Approved", DirectorateLabel = varUserDirectorateID),
                Filter(MonthlyReports, Status.Value = "Approved", SubmittedBy.Email = varUserEmail)
            )
        );

        // 3. KPI card counts
        Set(varApprovedTotal, CountRows(colApprovedReports));
        Set(
            varApprovedThisMonth,
            CountRows(Filter(colApprovedReports, ReportingMonth.Value = varCurrentMonth, 'FinancialYear '.Value = varCurrentFY))
        );
        Set(
            varApprovedThisFY,
            CountRows(Filter(colApprovedReports, 'FinancialYear '.Value = varCurrentFY))
        )
    Children:
      - ApprMainScreen_con:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =App.Width
          Children:
            - ApprNavRail:
                Control: CanvasComponent
                ComponentName: cmp_NavRail
                Properties:
                  ActiveScreen: ="scr_ApprovedReports"
            - ApprDetails_con:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =App.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  Width: =App.Width - ApprNavRail.Width
                Children:
                  - ApprAppHeader:
                      Control: CanvasComponent
                      ComponentName: cmp_AppHeader
                      Properties:
                        PageTitle: ="Approved Reports"
                        ShowBack: =true
                        ShowSearch: =false
                        Subtitle: =varApprovedTotal & " approved report(s) in scope"
                  - ApprFilterBar_con:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =App.Height * 0.07
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =8
                        PaddingRight: =8
                        Width: =Parent.Width
                      Children:
                        - ApprFY_drp:
                            Control: ModernDropdown@1.0.2
                            Properties:
                              AccessibleLabel: ="Financial Year"
                              Fill: =varBgLight
                              Height: =Parent.Height
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(MonthlyReports.'FinancialYear ')
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnChange: =Set(varApprFilterFY, ApprFY_drp.Selected.Value)
                              Width: =Parent.Width / 5
                        - ApprProgramme_drp:
                            Control: ModernDropdown@1.0.2
                            Properties:
                              Fill: =varBgLight
                              Height: =Parent.Height
                              ItemDisplayText: =ThisItem.Title
                              Items: =Programmes
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnChange: |-
                                =
                                Set(varApprFilterProgramme, ApprProgramme_drp.Selected.Title);
                                Set(varApprFilterDirectorate, "All");
                                Reset(ApprDirectorate_drp)
                              Width: =Parent.Width / 5
                        - ApprDirectorate_drp:
                            Control: ModernDropdown@1.0.2
                            Properties:
                              Fill: =varBgLight
                              Height: =Parent.Height
                              ItemDisplayText: =ThisItem.DirectorateID
                              Items: |-
                                =If(
                                    IsBlank(varApprFilterProgramme) || varApprFilterProgramme = "All",
                                    Directorates,
                                    Filter(Directorates, Programme.Value = varApprFilterProgramme)
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnChange: |-
                                =Set(
                                    varApprFilterDirectorate,
                                    If(IsBlank(ApprDirectorate_drp.Selected), "All", ApprDirectorate_drp.Selected.DirectorateID)
                                )
                              Width: =Parent.Width / 5
                        - ApprQuarter_drp:
                            Control: ModernDropdown@1.0.2
                            Properties:
                              Fill: =varBgLight
                              Height: =Parent.Height
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(MonthlyReports.Quarter)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnChange: =Set(varApprFilterQuarter, ApprQuarter_drp.Selected.Value)
                              Width: =Parent.Width / 5
                        - ApprClear_btn:
                            Control: ModernButton@1.0.0
                            Properties:
                              Height: =Parent.Height
                              Icon: ="ArrowClockwise"
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =
                                // Reset every dashboard filter and the search box
                                Set(varApprFilterFY, "All");
                                Set(varApprFilterProgramme, "All");
                                Set(varApprFilterDirectorate, "All");
                                Set(varApprFilterQuarter, "All");
                                Set(varApprSearchTerm, "");
                                Reset(ApprFY_drp);
                                Reset(ApprProgramme_drp);
                                Reset(ApprDirectorate_drp);
                                Reset(ApprQuarter_drp);
                                Reset(ApprSearch_txt)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Text: ="Clear Filters"
                              Width: =Parent.Width / 5
                  - ApprKPICards_con:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =App.Height * 0.12
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =14
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =Parent.Width
                      Children:
                        - ApprTotalCard_con:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width / 3
                            Children:
                              - ApprTotalAccent_rec:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    DisabledFill: =RGBA(161, 159, 157, 1)
                                    Fill: =RGBA(45, 128, 40, 1)
                                    FocusedBorderThickness: =4
                                    Height: =Parent.Height
                                    HoverFill: =RGBA(0, 120, 212, 1)
                                    PressedFill: =RGBA(0, 120, 212, 1)
                                    Width: =5
                              - ApprTotalBody_con:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =Parent.Height
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =12
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =12
                                    Width: =Parent.Width - 5
                                  Children:
                                    - ApprTotalTitle_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Font: =Font.'Segoe UI'
                                          Height: =Parent.Height * .25
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="TOTAL APPROVED"
                                    - ApprTotalCount_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height * .55
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =32
                                          Text: =varApprovedTotal
                        - ApprFYCard_con:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width / 3
                            Children:
                              - ApprFYAccent_rec:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    DisabledFill: =RGBA(161, 159, 157, 1)
                                    Fill: =RGBA(0, 120, 212, 1)
                                    FocusedBorderThickness: =4
                                    Height: =Parent.Height
                                    HoverFill: =RGBA(0, 120, 212, 1)
                                    PressedFill: =RGBA(0, 120, 212, 1)
                                    Width: =5
                              - ApprFYBody_con:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =Parent.Height
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =12
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =12
                                    Width: =Parent.Width - 5
                                  Children:
                                    - ApprFYTitle_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Font: =Font.'Segoe UI'
                                          Height: =Parent.Height * .25
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="APPROVED THIS FY"
                                    - ApprFYCount_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height * .55
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =32
                                          Text: =varApprovedThisFY
                        - ApprMonthCard_con:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width / 3
                            Children:
                              - ApprMonthAccent_rec:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    DisabledFill: =RGBA(161, 159, 157, 1)
                                    Fill: =RGBA(16, 110, 190, 1)
                                    FocusedBorderThickness: =4
                                    Height: =Parent.Height
                                    HoverFill: =RGBA(0, 120, 212, 1)
                                    PressedFill: =RGBA(0, 120, 212, 1)
                                    Width: =5
                              - ApprMonthBody_con:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =Parent.Height
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =12
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =12
                                    Width: =Parent.Width - 5
                                  Children:
                                    - ApprMonthTitle_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Font: =Font.'Segoe UI'
                                          Height: =Parent.Height * .25
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="APPROVED THIS MONTH"
                                    - ApprMonthCount_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height * .55
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =32
                                          Text: =varApprovedThisMonth
                  - ApprGallery_con:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =Parent.Width
                      Children:
                        - ApprSearch_con:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =Parent.Width
                            Children:
                              - ApprSearch_ico:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Color: =RGBA(113, 111, 110, 1)
                                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                    DisabledColor: =RGBA(225, 223, 221, 1)
                                    DisabledFill: =RGBA(0, 0, 0, 0)
                                    FocusedBorderThickness: =4
                                    Height: =32
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverColor: =RGBA(16, 110, 190, 1)
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    Icon: =Icon.Search
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                                    PressedColor: =RGBA(16, 110, 190, 1)
                                    PressedFill: =RGBA(0, 0, 0, 0)
                                    Width: =32
                              - ApprSearch_txt:
                                  Control: ModernTextInput@1.1.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.Solid
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =32
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: =Set(varApprSearchTerm, ApprSearch_txt.Text)
                                    Placeholder: ="Search approved reports by title or output..."
                                    Width: =Parent.Width - 120
                              - ApprResultCount_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AutoHeight: =true
                                    Color: =RGBA(113, 111, 110, 1)
                                    Height: =32
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingLeft: =4
                                    Size: =11
                                    Text: =CountRows(ApprReports_gal.AllItems) & " reports"
                                    Width: =80
                        - ApprReports_gal:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              Height: =Parent.Height
                              Items: |-
                                =// ApprReports_gal.Items — approved reports filtered by the search term and
                                // the FY/Programme/Directorate/Quarter dropdowns (single-column clauses,
                                // delegable on the collected colApprovedReports).
                                Filter(
                                    colApprovedReports,
                                    (varApprFilterFY = "All" || 'FinancialYear '.Value = varApprFilterFY) &&
                                    (varApprFilterProgramme = "All" || ProgrammeLabel = varApprFilterProgramme) &&
                                    (varApprFilterDirectorate = "All" || DirectorateLabel = varApprFilterDirectorate) &&
                                    (varApprFilterQuarter = "All" || Quarter.Value = varApprFilterQuarter) &&
                                    (
                                        IsBlank(varApprSearchTerm) ||
                                        Lower(varApprSearchTerm) in Lower(Title) ||
                                        Lower(varApprSearchTerm) in Lower(Output)
                                    )
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =
                                // Drill down into the read-only report view, remembering we came
                                // from the Approved dashboard so the back button returns here.
                                Navigate(scr_ReportView, ScreenTransition.Fade, {viewReportID: ThisItem.ID, returnTo: "Approved"})
                              TemplateSize: =92
                              Width: =Parent.Width
                            Children:
                              - ApprRowTitle_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(0, 0, 0, 1)
                                    FontWeight: =FontWeight.Bold
                                    Height: =22
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingRight: =0
                                    Size: =13
                                    Text: =ThisItem.Title
                                    Width: =Parent.Width * .65
                                    X: =10
                                    Y: =6
                              - ApprRowStatus_rec:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    DisabledFill: =RGBA(161, 159, 157, 1)
                                    Fill: =RGBA(45, 128, 40, 1)
                                    FocusedBorderThickness: =4
                                    Height: =ApprReports_gal.TemplateHeight * .7
                                    HoverFill: =RGBA(0, 120, 212, 1)
                                    OnSelect: =Select(Parent)
                                    PressedFill: =RGBA(0, 120, 212, 1)
                                    Width: =6
                                    X: =ApprReports_gal.TemplateWidth - 84
                                    Y: =15
                              - ApprRowStatus_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    FontWeight: =FontWeight.Semibold
                                    OnSelect: =Select(Parent)
                                    Size: =11.5
                                    Text: ="Approved"
                                    Width: =70
                                    X: =ApprReports_gal.TemplateWidth - 80
                                    Y: =36
                              - ApprRowMeta_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(113, 111, 110, 1)
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingTop: =0
                                    Size: =11
                                    Text: =ThisItem.DirectorateLabel & " · " & ThisItem.ProgrammeLabel
                                    Width: =Parent.Width * .9
                                    X: =10
                                    Y: =ApprRowTitle_lbl.Y + ApprRowTitle_lbl.Height
                              - ApprRowPeriod_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =RGBA(113, 111, 110, 1)
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingTop: =0
                                    Size: =11
                                    Text: =ThisItem.ReportingMonth.Value & " · " & ThisItem.'FinancialYear '.Value
                                    Width: =Parent.Width * .9
                                    X: =10
                                    Y: =ApprRowMeta_lbl.Y + ApprRowMeta_lbl.Height
                              - ApprRowChevron_ico:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Color: =RGBA(204, 204, 204, 1)
                                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                    DisabledColor: =RGBA(225, 223, 221, 1)
                                    DisabledFill: =RGBA(0, 0, 0, 0)
                                    FocusedBorderThickness: =4
                                    Height: =ApprReports_gal.TemplateHeight * 0.4
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverColor: =RGBA(16, 110, 190, 1)
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    Icon: =Icon.ChevronRight
                                    OnSelect: =Select(Parent)
                                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                                    PressedColor: =RGBA(16, 110, 190, 1)
                                    PressedFill: =RGBA(0, 0, 0, 0)
                                    Width: =20
                                    X: =ApprReports_gal.TemplateWidth - 30
                                    Y: =ApprRowStatus_lbl.Y
