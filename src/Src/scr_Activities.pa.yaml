Screens:
  scr_Activities:
    Properties:
      Fill: =varBgLight
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =
        // scr_Activities.OnVisible
        // Purpose: initialize mode/selection state, then load Activities
        // scoped to the current user's Directorate, and populate the
        // reference/filter collections the form and list depend on.

        Set(varMode, "View");
        Set(varActivitySearchTerm, "");
        Set(varActivityFilterProgramme, "All");
        Set(varActivityFilterDirectorate, "All");
        Set(varActivityFilterStatus, "All");
        Set(varConfirmDelete, false);

        // Scoped Activities list — role-first, single-column delegable filter.
        // Activities.DirectorateLabel is text = directorate full name, which
        // matches varUserDirectorate (APP_Users.Directorate.Value).
        ClearCollect(
            colActivitiesInScope,
            If(
                varCanViewAllReports,
                Activities,
                Filter(Activities, DirectorateLabel = varUserDirectorate)
            )
        );

        Set(varSelectedActivity, If(CountRows(colActivitiesInScope) > 0, First(colActivitiesInScope), Blank()));

        // Reference collections for the form dropdowns
        ClearCollect(colProgrammes, Programmes);
        ClearCollect(colDirectorates, Directorates);

        // Filter bar dropdown collections
        ClearCollect(colProgrammesFilter, {Title: "All", ProgrammeCode: "All"});
        Collect(colProgrammesFilter, Filter(Programmes, Active = true));

        ClearCollect(colDirectoratesFilter, {Title: "All", DirectorateID: "All"});
        Collect(colDirectoratesFilter, Filter(Directorates, Active = true));

        ClearCollect(colStatusFilter, {Value: "All"});
        Collect(colStatusFilter, Choices(Activities.Status));
