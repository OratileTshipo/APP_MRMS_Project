Screens:
  scr_ReportActivities:
    Properties:
      Fill: =varBgLight
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =
        // scr_ReportActivities.OnVisible
        // Purpose: build the role-scoped activities master list, reset the
        // screen-local filters, and default the selection + report form state.
        // This is the "Activities → Report" master-detail: pick an activity in
        // the left list and the report form opens in the detail pane on the right.
        //
        // Scope rule (per product decision):
        //   - Administrator / DeputyDirectorME (varCanViewAllReports) see ALL
        //     active activities.
        //   - Everyone else sees only their OWN activities
        //     (ActivityOwner.Email = varUserEmail).

        // 1. Filter state — reset every visit
        Set(varRepActSearchTerm, "");
        Set(varRepActFilterProgramme, "All");
        Set(varRepActFilterStatus, "All");

        // 2. Master list — role-scoped, delegable single-column filters.
        //    Load ALL active activities first (no column filter), then narrow
        //    in-memory for non-admin users.  This avoids any Lookup / delegation
        //    edge-cases and mirrors the pattern used on scr_Activities.
        ClearCollect(colReportActivities, Filter(Activities, 'Active ' = true));

        If(
            Not(varCanViewAllReports),
            ClearCollect(
                colReportActivities,
                Switch(
                    varUserRole,
                    "ProgrammeManager",
                        Filter(colReportActivities, ProgrammeLabel = varUserProgramme),
                    "Supervisor",
                        Filter(colReportActivities, DirectorateLabel = varUserDirectorate),
                    // Default (Contributor)
                    Filter(colReportActivities, DirectorateLabel = varUserDirectorate)
                )
            )
        );

        // 3. Default selection + report form state — load the existing report
        //    for the selected activity + current period (Edit), else start fresh (New)
        Set(varReportActivity, If(CountRows(colReportActivities) > 0, First(colReportActivities), Blank()));
        Set(varEditReport, If(IsBlank(varReportActivity), Blank(), First(Filter(MonthlyReports, Activity.Id = varReportActivity.ID, 'FinancialYear '.Value = varCurrentFY, ReportingMonth.Value = varCurrentMonth))));
        Set(varReportMode, If(IsBlank(varEditReport), "New", "Edit"));

        // 3b. Reset the form controls so their Default re-evaluates with the
        //     loaded record (Power Apps only re-evaluates Default on Reset())
        Reset(RepActTitle_txt);
        Reset(RepActMonth_drp);
        Reset(RepActQuarter_drp);
        Reset(RepActFY_drp);
        Reset(RepActPct_txt);
        Reset(RepActFormStatus_drp);
        Reset(RepActReason_txt);
        Reset(RepActRemedial_txt);
        Reset(RepActOutput_txt);

        // 4. Reference collections for the form dropdowns
        ClearCollect(colProgrammes, Programmes);

        // 5. Filter-bar collections
        //ClearCollect(colRepActProgrammesFilter, {Title: "All"});
        //Collect(colRepActProgrammesFilter, Filter(Programmes, Active = true));
        ClearCollect(colRepActProgrammesFilter, {Title: "All"});
        If(
            varUserRole in ["Administrator", "DeputyDirectorME"],
            Collect(colRepActProgrammesFilter, Filter(Programmes, Active = true)),
            Collect(colRepActProgrammesFilter, Filter(Programmes, Active = true, Title = varUserProgramme))
        );

        ClearCollect(colRepActStatusFilter, {Value: "All"});
        Collect(colRepActStatusFilter, Choices(Activities.Status))
