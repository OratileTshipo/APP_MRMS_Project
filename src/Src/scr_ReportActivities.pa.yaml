                                          Height: =40
                                          Icon: ="Save"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: "=\n// RepActSave_btn.OnSelect — validates required fields, then inserts a\n// new MonthlyReports record (New mode) or updates the loaded one (Edit\n// mode) using the MonthlyReports.csv schema; denormalised activity\n// fields are pulled from varReportActivity. After saving, the record is\n// reloaded so the form reflects the saved state (subsequent saves update\n// rather than duplicate). Stays on the screen for the next activity.\nIf(\n    IsBlank(varReportActivity),\n    Notify(\"Select an activity before saving the report.\", NotificationType.Error),\n\n    IsBlank(RepActTitle_txt.Text)\n    || IsBlank(RepActMonth_drp.Selected)\n    || IsBlank(RepActQuarter_drp.Selected)\n    || IsBlank(RepActFY_drp.Selected)\n    || IsBlank(RepActFormStatus_drp.Selected),\n\n    Notify(\"All required fields must be completed before saving.\", NotificationType.Error),\n\n    Patch(\n    MonthlyReports,\n    If(varReportMode = \"New\", Defaults(MonthlyReports), varEditReport),\n    {\n        Title: RepActTitle_txt.Text,\n        Activity: {\n            Id: varReportActivity.ID,\n            Value: varReportActivity.Title\n        },\n        ActivityOwnerLabel: Coalesce(varReportActivity.ActivityOwner.DisplayName, \"\"),\n        ProgrammeLabel: Coalesce(varReportActivity.ProgrammeLabel, \"\"),\n        DirectorateLabel: Coalesce(varReportActivity.DirectorateLabel, \"\"),\n        ReportingMonth: {Value: RepActMonth_drp.Selected.Value},\n        Quarter: {Value: RepActQuarter_drp.Selected.Value},\n        'FinancialYear ': {Value: RepActFY_drp.Selected.Value},\n        'PercentageComplete ': If(\n            IsBlank(RepActPct_txt.Text),\n            0,\n            Value(RepActPct_txt.Text)\n        ),\n        SubmissionStatus: {Value: RepActFormStatus_drp.Selected.Value},\n        ReasonForDeviation: RepActReason_txt.Text,\n        RemedialAction: RepActRemedial_txt.Text,\n        Output: RepActOutput_txt.Text,\n        SubmittedBy: {\n            Claims: \"i:0#.f|membership|\" & Lower(varUserEmail),\n            Department: \"\",\n            DisplayName: Coalesce(varUserFullName, varUserEmail),\n            Email: varUserEmail,\n            JobTitle: \"\",\n            Picture: \"\"\n        }\n    }\n);\n    \n    Notify(If(varReportMode = \"New\", \"Report saved.\", \"Report updated.\"), NotificationType.Success);\n    \n    // Reload the saved record so the form reflects it (Edit mode going forward)\n    Set(varEditReport, If(IsBlank(varReportActivity), Blank(), First(Filter(MonthlyReports, Activity.Id = varReportActivity.ID, 'FinancialYear '.Value = varCurrentFY, ReportingMonth.Value = varCurrentMonth))));\n    Set(varReportMode, If(IsBlank(varEditReport), \"New\", \"Edit\"));\n    Reset(RepActTitle_txt);\n    Reset(RepActMonth_drp);\n    Reset(RepActQuarter_drp);\n    Reset(RepActFY_drp);\n    //Reset(RepActPlanned_txt);\n    Reset(RepActPct_txt);\n    Reset(RepActFormStatus_drp);\n    Reset(RepActReason_txt);\n    Reset(RepActRemedial_txt);\n    Reset(RepActOutput_txt)\n)"
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =If(varReportMode = "Edit", "Update", "Save")
                                          Width: =110
