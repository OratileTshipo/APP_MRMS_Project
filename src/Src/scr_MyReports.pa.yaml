Screens:
  scr_MyReports:
    Properties:
      Fill: =varBgGrey
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =// ============================================================
        // scr_MyReports.OnVisible — v5 contributor report history
        // Purpose: reset filters, honour the deep link from
        // scr_MyActivities (varMyaSelectedActivityID), then load this
        // user's own MonthlyReports records.
        // ============================================================
        Set(varMyrFilterStatus, "All Statuses");
        Set(varMyrFilterFY, varCurrentFY);
        Set(varMyrFilterQuarter, "All Quarters");
        Set(varMyrFilterMonth, "All Months");
        Set(varMyrFilterActivityID, varMyaSelectedActivityID);
        Set(varMyrFilterActivityName, Coalesce(varMyaSelectedActivityName, ""));
        Set(varMyaSelectedActivityID, Blank());
        Set(varMyaSelectedActivityName, "");
        Set(varMyrDrawerOpen, false);
        Set(varMyrSelectedReport, Blank());
        ClearCollect(
            colMyrReports,
            Filter(MonthlyReports, SubmittedBy.Email = varUserEmail)
        )
    Children:
      - MyrShell_con:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =App.Width
          Children:
            # ============ SIDEBAR (v5 labelled rail) ============
            - MyrSidebar_con:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =varNavy
                  FillPortions: =0
                  Height: =App.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =20
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =20
                  Width: =App.Width * 0.16
                Children:
                  - MyrBrand_con:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        Width: =Parent.Width
                      Children:
                        - MyrLogo_lbl:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =varNavyDark
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Fill: =varGold
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =32
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                              Text: ="NW"
                              Width: =32
                        - MyrBrandText_con:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Height: =Parent.Height
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =Parent.Width - 62
                            Children:
                              - MyrBrandName_lbl:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =22
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =13.5
                                    Text: ="APP-MRMS"
                              - MyrBrandSub_lbl:
                                  Control: Label@2.5.1
