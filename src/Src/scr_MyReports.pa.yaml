                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =15
                              Text: |-
                                =Coalesce(varMyrSelectedReport.'Activity: ActivityShortDescription', "Report")
                              Width: =Parent.Width
                        - MyrDrawerStatus_lbl:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: |-
                                =Switch(
                                    varMyrSelectedReport.Status.Value,
                                    "Draft", varAccent,
                                    "Submitted", varGreen,
                                    "Approved", varGold,
                                    "Rejected", varRed,
                                    varTextMid
                                )
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Fill: |-
                                =Switch(
                                    varMyrSelectedReport.Status.Value,
                                    "Draft", varBlueBg,
                                    "Submitted", varGreenBg,
                                    "Approved", varAmberBg,
                                    "Rejected", varRedBg,
                                    varBgGrey
                                )
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =13
                              RadiusBottomRight: =13
                              RadiusTopLeft: =13
                              RadiusTopRight: =13
                              Size: =11
