                                          FocusedBorderThickness: =4
                                          Height: =6
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Width: =120 * ThisItem.Pct / 100
                                          X: =470
                                          Y: =26
                                    - MyrProg_lbl:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =varTextLight
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          Height: =18
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =11
                                          Text: =Round(ThisItem.Pct, 0) & "% complete"
                                          Width: =120
                                          X: =470
                                          Y: =36
                                    - MyrMeta_lbl:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =varTextMid
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          Height: =20
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =12
                                          Text: |-
                                            =Switch(
                                                ThisItem.Status.Value,
                                                "Draft",
                                                    If(
                                                        DateDiff(ThisItem.Modified, Today(), TimeUnit.Days) = 0, "Last saved today",
                                                        DateDiff(ThisItem.Modified, Today(), TimeUnit.Days) = 1, "Last saved yesterday",
                                                        "Last saved " & DateDiff(ThisItem.Modified, Today(), TimeUnit.Days) & " days ago"
                                                    ),
                                                "Submitted", "Submitted " & Text(ThisItem.SubmissionDate, "d mmm yyyy"),
                                                "Approved", "Approved " & Text(ThisItem.ReviewDate, "d mmm yyyy"),
                                                "Rejected", "Rejected " & Text(ThisItem.ReviewDate, "d mmm yyyy"),
                                                ""
                                            )
                                          Width: =160
                                          X: =620
                                          Y: =24
                                    - MyrStatus_lbl:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: |-
                                            =Switch(
                                                ThisItem.Status.Value,
                                                "Draft", varAccent,
                                                "Submitted", varGreen,
                                                "Approved", varGold,
                                                "Rejected", varRed,
                                                varTextMid
                                            )
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          Fill: |-
                                            =Switch(
                                                ThisItem.Status.Value,
                                                "Draft", varBlueBg,
                                                "Submitted", varGreenBg,
                                                "Approved", varAmberBg,
                                                "Rejected", varRedBg,
                                                varBgGrey
                                            )
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =26
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          RadiusBottomLeft: =13
                                          RadiusBottomRight: =13
                                          RadiusTopLeft: =13
                                          RadiusTopRight: =13
                                          Size: =11
                                          Text: =ThisItem.Status.Value
                                          Width: =110
                                          X: =800
                                          Y: =20
                                    - MyrAction_lbl:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: |-
                                            =If(
                                                ThisItem.Status.Value = "Rejected", RGBA(240, 201, 192, 1),
                                                varBorder
                                            )
                                          BorderStyle: =BorderStyle.Solid
                                          BorderThickness: =1
                                          Color: |-
                                            =If(
                                                ThisItem.Status.Value = "Rejected", varRed,
                                                varTextMid
                                            )
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          Fill: =varCardBg
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =36
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Set(varMyrSelectedReportID, ThisItem.ID);
                                             Set(varMyrSelectedReport, ThisItem);
                                             Set(varMyrDrawerOpen, true)
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =12.5
                                          Text: |-
                                            =If(
                                                ThisItem.Status.Value = "Draft", "Continue →",
                                                ThisItem.Status.Value = "Rejected", "Resubmit →",
                                                "View →"
                                            )
                                          Width: =120
                                          X: =940
                                          Y: =16
      # ============ READ-ONLY DETAIL DRAWER (topmost) ============
      - MyrDrawer_con:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(15, 23, 42, 0.55)
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            Visible: =varMyrDrawerOpen
            Width: =App.Width
          Children:
            - MyrDrawerCard_con:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Semilight
                  Fill: =varCardBg
                  Height: =App.Height * 0.72
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =Min(App.Width * 0.55, 720)
                Children:
                  - MyrDrawerHeader_con:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =varNavy
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =20
                        PaddingRight: =16
