                                      // display-friendly fields, filtered by status / FY / quarter / month,
                                      // the activity deep link from scr_MyActivities, and the search box.
                                      // Summary counts derive from this same filtered set (gallery.AllItems).
                                      Filter(
                                          AddColumns(
                                              colMyrReports,
                                              "ActivityName", Coalesce(ThisRecord.'Activity: ActivityShortDescription', ThisRecord.Activity.Value),
                                              "Pct", Coalesce(ThisRecord.'PercentageComplete ', 0),
                                              "Ver", Coalesce(ThisRecord.'Version ', 1),
                                              "FY", ThisRecord.'FinancialYear '.Value,
                                              "MonthNum", Switch(
                                                  ThisRecord.ReportingMonth.Value,
                                                  "April", 4, "May", 5, "June", 6, "July", 7, "August", 8, "September", 9,
                                                  "October", 10, "November", 11, "December", 12,
                                                  "January", 1, "February", 2, "March", 3, 0
                                              )
                                          ),
                                          (varMyrFilterStatus = "All Statuses" || Status.Value = varMyrFilterStatus),
                                          (varMyrFilterFY = "All" || FY = varMyrFilterFY),
                                          (varMyrFilterQuarter = "All Quarters" || Quarter.Value = varMyrFilterQuarter),
                                          (varMyrFilterMonth = "All Months" || ReportingMonth.Value = varMyrFilterMonth),
