                      Children:
                        # ---------- Hidden shared filter rebuild ----------
                        - RptApplyFilters_btn:
                            Control: button@2.2.0
                            Properties:
                              OnSelect: |-
                                =ClearCollect(
                                    colRptFiltered,
                                    Filter(
                                        colRptAll,
                                        (varRptFilterFY = "All" || 'FinancialYear '.Value = varRptFilterFY),
                                        (IsBlank(varRptFilterDirectorate) || DirectorateLabel = varRptFilterDirectorate),
                                        (IsBlank(varRptFilterProgramme) || ProgrammeLabel = varRptFilterProgramme),
                                        (varRptFilterMonth = "All Months" || ReportingMonth.Value = varRptFilterMonth),
                                        (varRptFilterStatus = "All Statuses" || Status.Value = varRptFilterStatus)
                                    )
                                );
                                ClearCollect(
                                    colRptTrend,
                                    AddColumns(
                                        ["April", "May", "June", "July", "August", "September", "October", "November", "December", "January", "February", "March"],
                                        "MonthCount",
                                        With(
                                            {m: ThisRecord.Value},
                                            CountIf(colRptFiltered, ReportingMonth.Value = m)
                                        )
                                    )
                                );
                                Set(varRptTrendMax, Max(1, Max(colRptTrend, MonthCount)));
                                ClearCollect(
                                    colRptStatus,
                                    AddColumns(
                                        ["Approved", "Submitted", "Draft", "Rejected", "Escalated"],
                                        "StatusCount",
                                        With(
                                            {s: ThisRecord.Value},
                                            CountIf(colRptFiltered, Status.Value = s)
                                        ),
                                        "StatusPct",
                                        With(
                                            {s: ThisRecord.Value},
                                            Round(CountIf(colRptFiltered, Status.Value = s) / Max(1, CountRows(colRptFiltered)) * 100, 1)
                                        ),
                                        "StatusColor",
                                        Switch(
                                            ThisRecord.Value,
                                            "Approved", varGreen,
                                            "Submitted", varAccent,
                                            "Draft", varTextMid,
                                            "Rejected", varRed,
                                            varPurple
                                        )
                                    )
                                );
                                ClearCollect(
                                    colRptDirectorates,
                                    Sort(
                                        AddColumns(
                                            GroupBy(
                                                ShowColumns(colRptFiltered, "DirectorateLabel"),
                                                "DirectorateLabel",
                                                "Rows"
                                            ),
                                            "AvgPct",
                                            Round(
                                                Average(
                                                    AddColumns(Rows, "P", Coalesce(ThisRecord.'PercentageComplete ', 0)),
                                                    P
                                                ),
                                                0
                                            )
                                        ),
                                        AvgPct,
                                        SortOrder.Descending
                                    )
                                )
