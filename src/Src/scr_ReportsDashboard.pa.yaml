Screens:
  scr_ReportsDashboard:
    Properties:
      Fill: =varBgGrey
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =// ============================================================
        // scr_ReportsDashboard.OnVisible — v5 reporting overview
        // Purpose: reset filters, load the full MonthlyReports set into
        // colRptAll, then run the shared ApplyFilters rebuild (via the
        // hidden RptApplyFilters_btn) that produces colRptFiltered,
        // colRptTrend, colRptStatus and colRptDirectorates. Every KPI,
        // chart and the detail gallery reads from those collections, so
        // changing a filter re-runs the same single rebuild.
        // ============================================================
        Set(varRptFilterFY, varCurrentFY);
        Set(varRptFilterDirectorate, Blank());
        Set(varRptFilterProgramme, Blank());
        Set(varRptFilterMonth, "All Months");
        Set(varRptFilterStatus, "All Statuses");
        ClearCollect(colRptAll, MonthlyReports);
        Select(RptApplyFilters_btn)
    Children:
      - RptShell_con:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =App.Width
          Children:
            # ============ SIDEBAR (v5 labelled rail) ============
            - RptSidebar_con:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =varNavy
                  FillPortions: =0
                  Height: =App.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =20
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =20
                  Width: =App.Width * 0.16
                Children:
                  - RptBrand_con:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =0
