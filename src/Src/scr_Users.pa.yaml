                                          - RegSubmit_btn:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                Height: =40
                                                Icon: ="Add"
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnSelect: "=// ============================================================\n// RegSubmit_btn.OnSelect — FINAL WORKING VERSION\n// ============================================================\n\n// ------------------------------------------------------------\n// 1. RESET ERROR STATE\n// ------------------------------------------------------------\nSet(varRegErrorMessage, \"\");\nSet(varRegSubmitSuccess, false);\n\n// ------------------------------------------------------------\n// 2. FIELD VALIDATION\n// ------------------------------------------------------------\nIf(\n    \n    IsBlank(varRegEmail),\n    Set(varRegErrorMessage, \"Please select a user.\"),\n    \n    Not(IsBlank(LookUp(APP_Users, UserAccount.Email = cmb_RegEmail.Selected.UserPrincipalName))),\n    Set(varRegErrorMessage, \"This user already exists in the system.\"), \n    \n    IsBlank(varRegRole),\n    Set(varRegErrorMessage, \"System Role is required.\"),\n    \n    IsBlank(varRegDirectorate),\n    Set(varRegErrorMessage, \"Directorate is required.\"),\n    \n    IsBlank(varRegProgramme),\n    Set(varRegErrorMessage, \"Programme is required.\"),\n    \n    IsBlank(varRegPassword),\n    Set(varRegErrorMessage, \"Password is required.\"),\n    \n    Len(varRegPassword) < 8,\n    Set(varRegErrorMessage, \"Password must be at least 8 characters.\"),\n    \n    IsBlank(varRegConfirmPassword),\n    Set(varRegErrorMessage, \"Please confirm the password.\"),\n    \n    varRegPassword <> varRegConfirmPassword,\n    Set(varRegErrorMessage, \"Passwords do not match.\"),\n    \n    !varRegAcceptTerms,\n    Set(varRegErrorMessage, \"You must accept the terms of use.\"),\n    \n    // ------------------------------------------------------------\n    // 3. ALL VALIDATIONS PASSED — SUBMIT\n    // ------------------------------------------------------------\n    // ------------------------------------------------------------\n    // 3. ALL VALIDATIONS PASSED — SUBMIT\n    // ------------------------------------------------------------\n    With(\n        {\n        newUser: Patch(\n            APP_Users,\n            Defaults(APP_Users),\n            {\n                Title: varRegFullName,\n                UserAccount: {\n                    Claims: \"i:0#.f|membership|\" & Lower(varRegEmail),\n                    Department: \"Public Works and Roads\",\n                    DisplayName: varRegFullName,\n                    Email: Lower(cmb_RegEmail.Selected.Mail),\n                    JobTitle: cmb_RegEmail.Selected.JobTitle,\n                    Picture: \"\"\n                },\n                Role: {Value: varRegRole},\n                Programme: {\n                    Id: drp_RegProgramme.Selected.ID,\n                    Value: drp_RegProgramme.Selected.Title\n                },\n                Directorate: {\n                    Id: drp_RegDirectorate.Selected.ID,\n                    Value: drp_RegDirectorate.Selected.DirectorateID\n                }\n            }\n        )\n    },\n    Patch(\n        APP_Users,\n        newUser,\n        {'Active ': true}\n    )\n);\n    \n    // ------------------------------------------------------------\n    // 4. SUCCESS — reset form\n    // ------------------------------------------------------------\n    Set(varRegSubmitSuccess, true);\n    Set(varRegErrorMessage, \"\");\n    Set(varRegFullName, \"\");\n    Set(varRegEmail, \"\");\n    Set(varRegPhone, \"\");\n    Set(varRegRole, \"\");\n    Set(varRegDirectorate, \"\");\n    Set(varRegProgramme, \"\");\n    Set(varRegPassword, \"\");\n    Set(varRegConfirmPassword, \"\");\n    Set(varRegAcceptTerms, false);\n    Set(varRegPasswordMismatch, false);\n    Set(varRegEmailExists, false);\n    Set(varRegPasswordStrength, \"\");\n    Reset(txt_RegFullName);\n    Reset(cmb_RegEmail);\n    Reset(txt_RegPhone);\n    Reset(drp_RegRole);\n    Reset(drp_RegDirectorate);\n    Reset(drp_RegProgramme);\n    Reset(txt_RegPassword);\n    Reset(txt_RegConfirmPassword);\n    Reset(chk_RegAcceptTerms)\n)"
