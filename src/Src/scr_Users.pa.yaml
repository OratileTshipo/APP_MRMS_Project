                                                            Size: =12
                                                            Text: ="Select User *"
                                                            Width: =Parent.Width
                                                      - cmb_RegEmail:
                                                          Control: ModernCombobox@1.1.1
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Center
                                                            BorderColor: =RGBA(214, 221, 224, 1)
                                                            BorderStyle: =BorderStyle.Solid
                                                            BorderThickness: =2
                                                            Fill: =RGBA(255, 255, 255, 1)
                                                            Height: =(Parent.Height / 4) - 2
                                                            InputTextPlaceholder: ="Search User by Email or Name"
                                                            ItemDisplayText: =ThisItem.UserPrincipalName
                                                            Items: |-
                                                              =// cmb_RegEmail.Items — live user search against Microsoft Entra ID (Office365Users connector).
                                                              // SearchUserV2 returns user records (UserPrincipalName/DisplayName/Mail/JobTitle)
                                                              // for the typed search text; the picker stores the selected record in .Selected.
                                                              Office365Users.SearchUserV2({searchTerm: cmb_RegEmail.SearchText, top: 20}).value
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            OnChange: "=\nSet(varRegEmail, cmb_RegEmail.Selected.UserPrincipalName);\nSet(varRegEmailExists, Not(IsBlank(LookUp(APP_Users, UserAccount.Email = cmb_RegEmail.Selected.UserPrincipalName))));\nSet(varRegFormIsValid, false)\n\n         "
                                                            RadiusBottomLeft: =8
                                                            RadiusBottomRight: =8
                                                            RadiusTopLeft: =8
                                                            RadiusTopRight: =8
                                                            SelectMultiple: =false
                                                            Width: =Parent.Width - 10
                                                      - RegFullNameLabel_lbl:
