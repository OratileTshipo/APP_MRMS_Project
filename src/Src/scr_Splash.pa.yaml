Screens:
  scr_Splash:
    Properties:
      Fill: |-
        =//varNavy
        RGBA(0, 0, 0, 0)
      ImagePosition: =ImagePosition.Center
      LoadingSpinner: =LoadingSpinner.Controls
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =Timer_Splash.Start
    Children:
      - con_SplashCenter:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =App.Width
          Children:
            - Image1:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =170
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Image: ='dpwr logo'
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
            - lbl_AppTitle:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: |-
                    =//RGBA(230, 230, 230, 1)
                    RGBA(0, 0, 0, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LineHeight: =1.5
                  Size: =40
                  Text: ="APP-MRMS"
                  Width: =Parent.Width
            - lbl_AppSubtitle:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: |-
                    =//varLBlue
                    RGBA(0, 0, 0, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =16
                  Text: ="Monthly Reporting Management System"
            - lbl_AppInfo:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: |-
                    =//RGBA(230, 230, 230, 1)
                    RGBA(0, 0, 0, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Text: ="Annual Performance Plan · Monthly Reporting"
            - rec_Divider:
                Control: Rectangle@2.3.0
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =4
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =RGBA(45, 128, 40, 1)
                  FocusedBorderThickness: =4
                  Height: =2
                  HoverFill: =RGBA(0, 120, 212, 1)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PressedFill: =RGBA(0, 120, 212, 1)
                  Width: =280
            - lbl_DeptName:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: "=//ColorValue(\"#AABBD4\")\r\nRGBA(0, 0, 0, 1) "
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =12
                  Text: ="Department of Public Works & Roads"
            - lbl_LoadingStatus:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: =RGBA(113, 111, 110, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =Font.'Segoe UI'
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =11
                  Text: ="AUTHENTICATING WITH MICROSOFT 365 · LOADING PROGRAMME DATA..."
                  Y: =rec_SplashAccent.Y + 50
            - Timer_Splash:
                Control: Timer@2.1.0
                Properties:
                  BorderColor: =RGBA(0, 120, 212, 1)
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(242, 242, 241, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Duration: =1800
                  Fill: =RGBA(0, 120, 212, 1)
                  Font: =Font.'Segoe UI'
                  HoverBorderColor: =RGBA(16, 110, 190, 1)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(16, 110, 190, 1)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnTimerEnd: =Navigate(scr_Home, ScreenTransition.Fade)
                  PressedBorderColor: =RGBA(16, 110, 190, 1)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(16, 110, 190, 1)
                  Visible: =false
            - Button1:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =RGBA(8, 222, 8, 1)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Navigate(scr_Home,ScreenTransition.Fade)
                  Text: ="Continue"
      - rec_SplashAccent:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            DisabledFill: =RGBA(161, 159, 157, 1)
            Fill: =RGBA(45, 128, 40, 1)
            FocusedBorderThickness: =4
            Height: =8
            HoverFill: =RGBA(0, 120, 212, 1)
            PressedFill: =RGBA(0, 120, 212, 1)
            Width: =Parent.Width
            Y: =551
      - lbl_AppVersion:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(145, 143, 141, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(113, 111, 110, 1)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            Text: '="v1.0  | 2026 " '
            X: =40
            Y: =40
