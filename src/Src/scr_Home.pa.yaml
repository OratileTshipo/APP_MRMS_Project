Screens:
  scr_Home:
    Properties:
      Fill: =varBgLight
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |+
        =// ============================================================
        // scr_Home.OnVisible — PRODUCTION VERSION
        // Purpose: initialize filter state, then build every collection
        // this screen's KPI cards, gallery, progress panel, and trend
        // chart depend on. Order matters — collections that reference
        // colReportsInScope must be built AFTER it.
        // ============================================================

        // ------------------------------------------------------------
        // 1. FILTER STATE — screen-local UI variables, reset every visit
        // ------------------------------------------------------------
        Set(varHomeFilter, "All");           // KPI card selection (All/PendingApprovals/Overdue/Approved)
        Set(varFilterFY, "All");             // Financial Year dropdown
        Set(varFilterProgramme, "All");      // Programme dropdown
        Set(varFilterDirectorate, "All");    // Directorate dropdown (cascades off Programme)
        Set(varFilterQuarter, "All");        // Quarter dropdown
        Set(varFilterDirectorateID, "All");  // filter Monthlyreports or colReportsInScope


        // ------------------------------------------------------------
        // 2. BASE SCOPE — every report this user is allowed to see
        //    Contributors/Supervisors/ProgrammeManagers: own Directorate/Programme only
        //    DeputyDirectorME/Administrator: everything (varCanViewAllReports = true)
        // ------------------------------------------------------------
        // Role-first scope: one simple single-column filter per role so the
        // SharePoint query stays delegable (OR across columns is not delegated).
        // MonthlyReports.DirectorateLabel stores the directorate SHORT CODE
        // Supervisor/Contributor: own directorate only (full name).
        ClearCollect(
            colReportsInScope,
            Switch(
                varUserRole,
                "Administrator", MonthlyReports,
                "DeputyDirectorME", MonthlyReports,
                "ProgrammeManager", Filter(MonthlyReports, ProgrammeLabel = varUserProgramme),
                "Supervisor", Filter(MonthlyReports, DirectorateLabel = varUserDirectorate),
                Filter(MonthlyReports, SubmittedBy.Email = varUserEmail)
            )
        );

        // Refresh the collected Activities set — the inline trend/progress
        // galleries below filter over colActivities, not the raw list.
        /*
        ClearCollect(
            colActivities,
            Filter(Activities, 'Active ' = true)
        );
        */

        ClearCollect(
            colActivities,
            Switch(
                varUserRole,
                "Administrator", Filter(Activities, 'Active ' = true),
                "DeputyDirectorME", Filter(Activities, 'Active ' = true),
                "ProgrammeManager", Filter(Activities, 'Active ' = true, ProgrammeLabel = varUserProgramme),
                "Supervisor", Filter(Activities, 'Active ' = true, DirectorateLabel = varUserDirectorate),
                Filter(Activities, 'Active ' = true, DirectorateLabel = varUserDirectorate)
            )
        );






        // ------------------------------------------------------------
        // 3. NOTIFICATIONS — always personal, never scoped by directorate
        // ------------------------------------------------------------
        ClearCollect(
            colMyNotifications,
            Filter(Notifications, RecipientUser.Email = varUserEmail, IsRead = false)
        );
        Set(varUnreadCount, CountRows(colMyNotifications));

        // ------------------------------------------------------------
        // 4. MY ACTIVITIES — always personal (this user's own assigned activities)
        // ------------------------------------------------------------
        ClearCollect(
            colMyActivities,
            Filter(Activities, ActivityOwner.Email = varUserEmail, 'Active ' = true)
        );

        // ------------------------------------------------------------
        // 5. PENDING APPROVALS — only meaningful for reviewer roles
        // ------------------------------------------------------------
        ClearCollect(
            colPendingApprovals,
            If(
                varUserRole in ["Supervisor", "ProgrammeManager", "DeputyDirectorME", "Administrator"],
                Filter(colReportsInScope, ReportStatus.Value = "Submitted", 'FinancialYear '.Value = varCurrentFY),
                Table()
            )
        );

        // ------------------------------------------------------------
        // 6. OVERDUE ITEMS — scoped (consumed by the KPI cards below)
        // ------------------------------------------------------------
        ClearCollect(
            colOverdueItems,
            Filter(colReportsInScope, IsOverdue = true, 'FinancialYear '.Value = varCurrentFY)
        );

        // ------------------------------------------------------------
        // 7. APPROVED THIS MONTH — scoped
        // ------------------------------------------------------------
        ClearCollect(
            colApprovedThisMonth,
            Filter(
                colReportsInScope,
                ReportStatus.Value = "Approved",
                ReportingMonth.Value = varCurrentMonth,
                'FinancialYear '.Value = varCurrentFY
            )
        );

        // ------------------------------------------------------------
        // 8. KPI — Total APP Items in scope (distinct activities reported on)
        // ------------------------------------------------------------
        Set(varTotalAPPItems, CountRows(Distinct(colReportsInScope, Activity.Id)));

        // ============================================================
        // END OF scr_Home.OnVisible
        // ============================================================

