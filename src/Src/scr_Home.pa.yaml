                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =RGBA(245, 245, 245, 1)
                                    Height: =Parent.Height
                                    Items: |-
                                      =// MonthlyTrend_gal.Items — 12-month submissions trend.
                                      // Builds one row per month of the financial year (Apr→Mar) by filtering
                                      // the already-collected colActivities (local execution, no delegation limits).
                                      ForAll(
                                          Sequence(12, 0, 1) As MonthOffset,
                                          With(
                                              { monthAnchor: DateAdd(Date(Year(Today()),4,1), MonthOffset.Value, TimeUnit.Months) },
                                              With(
                                                  {
                                                      monthName: Text(monthAnchor, "mmmm"),
                                                      dueThisMonth: Filter(
                                                          colActivities,
                                                          Month(EndDate) = Month(monthAnchor),
                                                          Year(EndDate) = Year(monthAnchor),
                                                          (varFilterProgramme = "All" || ProgrammeLabel = varFilterProgramme),
                                                          (varFilterDirectorate = "All" || DirectorateLabel = varFilterDirectorate),
                                                          (
                                                              IsBlank(HomeSearchBox_txt.Text)
                                                              || Lower(HomeSearchBox_txt.Text) in Lower(Title)
                                                              || Lower(HomeSearchBox_txt.Text) in Lower('ActivityDescription ')
                                                          )
                                                      )
                                                  },
                                                  With(
                                                      {
                                                          reportsForDueActivities: Filter(
                                                              colReportsInScope,
                                                              !IsBlank(LookUp(dueThisMonth, ID = Activity.Id)),
                                                              (varFilterFY = "All" || 'FinancialYear '.Value = varFilterFY),
                                                              (varFilterQuarter = "All" || Quarter.Value = varFilterQuarter),
                                                              (varHomeFilter = "All"
                                                                  || (varHomeFilter = "PendingApprovals" && SubmissionStatus.Value = "Submitted")
                                                                  || (varHomeFilter = "Overdue" && IsOverdue = true)
                                                                  || (varHomeFilter = "Approved" && ReportStatus.Value = "Approved")
                                                                  || (varHomeFilter = "Rejected" && ReportStatus.Value = "Rejected")
                                                              )
                                                          )
                                                      },
                                                      {
                                                          MonthName: monthName,
                                                          TotalActivities: CountRows(dueThisMonth),
                                                          OnTimeCount: CountRows(Filter(reportsForDueActivities, SubmissionDate <= LookUp(dueThisMonth, ID = Activity.Id, DueDate))),
