                                          AutoHeight: =true
                                          Color: |-
                                            =// OverdueSubtitle_lbl.Color
                                            /*With(
                                                {
                                                    overdueLastMonth: CountRows(Filter(colOverdueItems, ReportingMonth.Value = Text(DateAdd(Date(Year(Today()), Month(Today()), 1), -1, TimeUnit.Months), "mmmm"))),
                                                    overdueThisMonth: CountRows(Filter(colOverdueItems, ReportingMonth.Value = varCurrentMonth))
                                                },
                                                If(
                                                    overdueThisMonth > overdueLastMonth,
                                                    RGBA(189,49,51,1),
                                                    If(
                                                        overdueThisMonth < overdueLastMonth,
                                                        RGBA(45,128,40,1),
                                                        RGBA(113,111,110,1)
                                                    )
                                                )
                                            )*/

                                            With(
                                                {
                                                    overdueScoped: Filter(
                                                        colReportsInScope,
                                                        IsOverdue = true,
                                                        (varFilterFY = "All" || 'FinancialYear '.Value = varFilterFY),
                                                        (varFilterProgramme = "All" || ProgrammeLabel = varFilterProgramme),
                                                        (varFilterDirectorate = "All" || DirectorateLabel = varFilterDirectorate),
                                                        (varFilterQuarter = "All" || Quarter.Value = varFilterQuarter)
                                                    )
                                                },
                                                With(
                                                    {
                                                        overdueLastMonth: CountRows(Filter(overdueScoped, ReportingMonth.Value = Text(DateAdd(Date(Year(Today()), Month(Today()), 1), -1, TimeUnit.Months), "mmmm"))),
                                                        overdueThisMonth: CountRows(Filter(overdueScoped, ReportingMonth.Value = varCurrentMonth))
                                                    },
                                                    If(
                                                        overdueThisMonth > overdueLastMonth, RGBA(189,49,51,1),
                                                        If(overdueThisMonth < overdueLastMonth, RGBA(45,128,40,1), RGBA(113,111,110,1))
                                                    )
                                                )
                                            )
                                          Height: =Parent.Height * .2
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Set(varHomeFilter, "Overdue")
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: |+
                                            =// Get last month's name, handling the April year-wrap correctly
                                            // (if current month is January, "last month" is December of the previous calendar year — but
                                            // since your FY starts in April, wrapping from April back to March is the only edge case that matters here)
                                            /*
                                            With(
                                                {
                                                    lastMonthName: Text(DateAdd(Date(Year(Today()), Month(Today()), 1), -1, TimeUnit.Months), "mmmm")
                                                },
                                                With(
                                                    {
                                                        overdueLastMonth: CountRows(Filter(colOverdueItems, ReportingMonth.Value = lastMonthName)),
                                                        overdueThisMonth: CountRows(Filter(colOverdueItems, ReportingMonth.Value = varCurrentMonth))
                                                    },
                                                    If(
                                                        overdueThisMonth > overdueLastMonth,
                                                        "▲ " & (overdueThisMonth - overdueLastMonth) & " vs last month",
                                                        If(
                                                            overdueThisMonth < overdueLastMonth,
                                                            "▼ " & (overdueLastMonth - overdueThisMonth) & " vs last month",
                                                            "No change vs last month"
                                                        )
                                                    )
                                                )
                                            )
                                            */

                                            With(
                                                {
                                                    overdueScoped: Filter(
                                                        colReportsInScope,
                                                        IsOverdue = true,
                                                        (varFilterFY = "All" || 'FinancialYear '.Value = varFilterFY),
                                                        (varFilterProgramme = "All" || ProgrammeLabel = varFilterProgramme),
                                                        (varFilterDirectorate = "All" || DirectorateLabel = varFilterDirectorate),
                                                        (varFilterQuarter = "All" || Quarter.Value = varFilterQuarter)
                                                    ),
                                                    lastMonthName: Text(DateAdd(Date(Year(Today()), Month(Today()), 1), -1, TimeUnit.Months), "mmmm")
                                                },
                                                With(
                                                    {
                                                        overdueLastMonth: CountRows(Filter(overdueScoped, ReportingMonth.Value = lastMonthName)),
                                                        overdueThisMonth: CountRows(Filter(overdueScoped, ReportingMonth.Value = varCurrentMonth))
                                                    },
                                                    If(
                                                        overdueThisMonth > overdueLastMonth, "▲ " & (overdueThisMonth - overdueLastMonth) & " vs last month",
                                                        If(overdueThisMonth < overdueLastMonth, "▼ " & (overdueLastMonth - overdueThisMonth) & " vs last month", "No change vs last month")
                                                    )
                                                )
                                            )

