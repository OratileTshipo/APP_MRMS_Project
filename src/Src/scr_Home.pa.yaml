                                    Items: |-
                                      =// ProgrammeProgress_gal.Items — progress per programme for the effective FY.
                                      // Groups the collected colActivities by ProgrammeLabel and aggregates
                                      // % complete from the associated monthly reports.
                                      With(
                                          { effectiveFY: If(varFilterFY = "All", varCurrentFY, varFilterFY) },
                                          ForAll(
                                              Distinct(
                                                  Filter(colActivities, (varFilterProgramme = "All" || ProgrammeLabel = varFilterProgramme)),
                                                  ProgrammeLabel
                                              ) As Prog,
                                              With(
                                                  {
                                                      progName: Prog.Value,
                                                      progActivities: Filter(
                                                          colActivities,
                                                          ProgrammeLabel = Prog.Value,
                                                          (varFilterDirectorate = "All" || DirectorateLabel = varFilterDirectorate)
                                                      )
                                                  },
                                                  With(
                                                      {
                                                          progReportsFY: Filter(
                                                              colReportsInScope,
                                                              ProgrammeLabel = Prog.Value,
                                                              'FinancialYear '.Value = effectiveFY,
                                                              (varFilterDirectorate = "All" || DirectorateLabel = varFilterDirectorate),
                                                              (varFilterQuarter = "All" || Quarter.Value = varFilterQuarter)
                                                          ),
                                                          progReportsThisMonth: Filter(
                                                              colReportsInScope,
                                                              ProgrammeLabel = Prog.Value,
                                                              'FinancialYear '.Value = effectiveFY,
                                                              ReportingMonth.Value = varCurrentMonth,
                                                              (varFilterDirectorate = "All" || DirectorateLabel = varFilterDirectorate)
                                                          )
                                                      },
                                                      {
                                                          ProgrammeName: progName,
                                                          TotalActivities: CountRows(progActivities),
                                                          MonthlyReportedCount: CountRows(Distinct(progReportsThisMonth, Activity.Id)),
                                                          MonthlyApprovedCount: CountRows(Distinct(Filter(progReportsThisMonth, ReportStatus.Value = "Approved"), Activity.Id)),
                                                          FYApprovedActivityCount: CountRows(Distinct(Filter(progReportsFY, ReportStatus.Value = "Approved"), Activity.Id)),
                                                          MonthlyReportingRate:
                                                              If(CountRows(progActivities) = 0, 0,
                                                                  RoundUp((CountRows(Distinct(progReportsThisMonth, Activity.Id)) / CountRows(progActivities)) * 100, 0)),
                                                          MonthlyApprovalRate:
                                                              If(CountRows(progActivities) = 0, 0,
                                                                  RoundUp((CountRows(Distinct(Filter(progReportsThisMonth, ReportStatus.Value = "Approved"), Activity.Id)) / CountRows(progActivities)) * 100, 0)),
                                                          FYCumulativeRate:
                                                              If(CountRows(progActivities) = 0, 0,
                                                                  RoundUp((CountRows(Distinct(Filter(progReportsFY, ReportStatus.Value = "Approved"), Activity.Id)) / CountRows(progActivities)) * 100, 0)),
