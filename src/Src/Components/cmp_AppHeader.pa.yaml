ComponentDefinitions:
  cmp_AppHeader:
    DefinitionType: CanvasComponent
    Description: 'Reusable app header: page title, user context line, optional search box and back button.'
    AccessAppScope: true
    CustomProperties:
      PageTitle:
        PropertyKind: Input
        Description: Screen title shown in the header.
        DataType: Text
        Default: =""
      SearchHint:
        PropertyKind: Input
        Description: Placeholder text for the search box.
        DataType: Text
        Default: ="Search..."
      SearchText:
        PropertyKind: Output
        Description: Current search box text — screens filter galleries on this.
        DataType: Text
      ShowBack:
        PropertyKind: Input
        Description: Show the back arrow; OnSelect calls Back().
        DataType: Boolean
        Default: =false
      ShowSearch:
        PropertyKind: Input
        Description: Show the search box.
        DataType: Boolean
        Default: =true
      Subtitle:
        PropertyKind: Input
        Description: Optional context subtitle. When blank the header falls back to the user's directorate · programme context line.
        DataType: Text
        Default: =""
    Properties:
      Fill: =varNavy
      Height: =App.Height * 0.13
      SearchText: =HeaderSearchInput_txt.Text
      Width: =App.Width * 0.95
    Children:
      - HeaderMain_con:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.Semilight
            Fill: =varNavy
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =20
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - HeaderBack_ico:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =Parent.Height * 0.5
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.ArrowLeft
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Back()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Tooltip: ="Go back"
                  Visible: =cmp_AppHeader.ShowBack
                  Width: =Parent.Width * 0.04
            - HeaderTitles_con:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width * 0.55
                Children:
                  - HeaderTitle_lbl:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =Parent.Height * 0.5
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =25
                        Text: =cmp_AppHeader.PageTitle
                  - HeaderSubtitle_lbl:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height * 0.5
                        Size: =12
                        Text: =If(IsBlank(cmp_AppHeader.Subtitle), varUserDirectorate & " · " & varUserProgramme, cmp_AppHeader.Subtitle)
                        X: =40
                        Y: =40
            - HeaderActions_con:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =20
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width / 3
                Children:
                  - HeaderSearch_con:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Fill: =varBgLight
                        Height: =Parent.Height * 0.65
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =10
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =cmp_AppHeader.ShowSearch
                        Width: =Parent.Width - 50
                      Children:
                        - HeaderSearch_ico:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =RGBA(153, 153, 153, 1)
                              DisabledBorderColor: =RGBA(245, 245, 245, 1)
                              DisabledColor: =RGBA(225, 223, 221, 1)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =Parent.Height * 0.65
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(16, 110, 190, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Icon: =Icon.Search
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(16, 110, 190, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =Parent.Width * 0.08
                        - HeaderSearchInput_txt:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              BorderThickness: =0
                              Clear: =true
                              Color: =RGBA(50, 49, 48, 1)
                              Default: =
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: =varBgLight
                              Font: =Font.'Segoe UI'
                              Height: =Parent.Height * 0.65
                              HintText: =cmp_AppHeader.SearchHint
                              HoverBorderColor: =RGBA(16, 110, 190, 1)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(255, 255, 255, 1)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PressedBorderColor: =RGBA(0, 120, 212, 1)
                              PressedColor: =RGBA(50, 49, 48, 1)
                              PressedFill: =RGBA(255, 255, 255, 1)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =15
                              Width: =Parent.Width - HeaderSearch_ico.Width - 25
                  - HeaderBell_ico:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(0, 120, 212, 1)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =Parent.Height * 0.4
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(16, 110, 190, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Bell
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(16, 110, 190, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Width: =Parent.Width / 15
                  - HeaderSignOut_ico:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Sign out"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =Parent.Height * 0.4
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Power
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =// SIGN OUT — clear every session variable and return to the login screen
                          Set(varCurrentUserRecord, Blank());
                          Set(varUserEmail, Blank());
                          Set(varUserFullName, Blank());
                          Set(varUserRole, Blank());
                          Set(varUserDirectorate, Blank());
                          Set(varUserProgramme, Blank());
                          Set(varUserDirectorateID, Blank());
                          Set(varCanViewAllReports, false);
                          Clear(colMyNotifications);
                          Set(varUnreadCount, 0);
                          Set(varLoginError, "");
                          Set(varLoginAttempts, 0);
                          Navigate(scr_Login, ScreenTransition.Fade)
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Tooltip: ="Sign out"
                        Width: =Parent.Width / 15
