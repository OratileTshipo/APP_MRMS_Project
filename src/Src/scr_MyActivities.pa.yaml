Screens:
  scr_MyActivities:
    Properties:
      Fill: =varBgLight
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =// ============================================================
        // scr_MyActivities.OnVisible — PRODUCTION VERSION
        // Purpose: initialise filter state and load user's assigned activities
        // with their latest report status for the current reporting period
        // ============================================================

        // ------------------------------------------------------------
        // 1. FILTER STATE — reset every visit
        // ------------------------------------------------------------
        Set(varActFilterFY, varCurrentFY);
        Set(varActFilterMonth, "All");
        Set(varActFilterStatus, "All");

        // ------------------------------------------------------------
        // 2. LOAD MY ACTIVITIES — this user's own assigned activities
        // ------------------------------------------------------------
        ClearCollect(
            colMyActivities,
            Filter(Activities, ActivityOwner.Email = varUserEmail, 'Active ' = true)
        );

        // ------------------------------------------------------------
        // 3. BUILD ACTIVITY STATUS — join each activity with its latest
        //    report for the selected FY/month, derive RAG and action label
        // ------------------------------------------------------------
        // Performance (troubleshooting guide §4.6): pull the current-FY report
        // set into a local collection ONCE, then filter it in the loop below —
        // otherwise the ForAll issues one delegated query to the raw
        // MonthlyReports list PER ACTIVITY (N round trips per screen visit).
        ClearCollect(
            colMyReportsFY,
            Filter(MonthlyReports, 'FinancialYear '.Value = varCurrentFY)
        );
        ClearCollect(
            colMyActivityStatus,
            ForAll(
                colMyActivities As Act,
                With(
                    {
                        latestReport: First(
                            Filter(
                                colMyReportsFY,
                                Activity.Id = Act.ID
                            )
                        )
                    },
                    {
                        ActivityID: Act.ID,
                        ActivityName: Act.ActivityShortDescription,
                        ProjectName: Act.Project.Value,
                        ProgrammeName: Act.ProgrammeLabel,
                        DirectorateName: Act.DirectorateLabel,
                        Frequency: Act.'Frequency ',
                        DueDay: Day(Act.DueDate),
                        ReportStatus: Coalesce(latestReport.Status.Value, "Not Started"),
                        ReportID: Coalesce(latestReport.ID, Blank()),
                        RAG: Switch(
                            Coalesce(latestReport.Status.Value, "Not Started"),
                            "Approved", "Green",
                            "Draft", "Amber",
                            "Submitted", "Amber",
                            "Rejected", "Red",
                            "Green"
                        ),
                        ActionLabel: Switch(
                            Coalesce(latestReport.Status.Value, "Not Started"),
                            "Not Started", "Start Report",
                            "Draft", "Continue",
                            "Submitted", "Submitted ✓",
                            "Rejected", "Resubmit",
                            "Approved", "View",
                            "Start Report"
                        ),
                        ActionDisabled: Coalesce(latestReport.Status.Value, "Not Started") = "Submitted",
                        IsOverdue: Coalesce(latestReport.IsOverdue, false),
                        IsFlagged: Coalesce(latestReport.isFlagged, false)
                    }
                )
            )
        );

        // ------------------------------------------------------------
        // 4. SET RESULT COUNT
        // ------------------------------------------------------------
        Set(varActResultCount, CountRows(colMyActivityStatus));

        // ============================================================
        // END OF scr_MyActivities.OnVisible
        // ============================================================
    Children:
      - scr_Activities_con:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =App.Width
          Children:
            - MyActivitiesNavRail:
                Control: CanvasComponent
                ComponentName: cmp_NavRail
                Properties:
                  ActiveScreen: ="scr_MyActivities"
            - ActivitiesMainScreen_con:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =App.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  Width: =App.Width - MyActivitiesNavRail.Width
                Children:
                  - MyActivitiesAppHeader:
                      Control: CanvasComponent
                      ComponentName: cmp_AppHeader
                      Properties:
                        PageTitle: ="My Activities"
                        ShowBack: =false
                        ShowSearch: =true
                        SearchHint: ="Search my activities..."
                  - ActivitiesMainContent_con:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(204, 218, 228, 1)
                        Height: =Parent.Height - MyActivitiesAppHeader.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        Width: =Parent.Width
                      Children:
                        - ActFilterBar_con:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =varBgLight
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                            Children:
                              - ActFYFilter_drp:
                                  Control: ModernDropdown@1.0.2
                                  Properties:
                                    AccessibleLabel: ="Financial Year"
                                    Fill: =varBgLight
                                    Height: =34
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(MonthlyReports.'FinancialYear ')
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: =Set(varActFilterFY, ActFYFilter_drp.Selected.Value)
                                    Width: =180
                              - ActMonthFilter_drp:
                                  Control: ModernDropdown@1.0.2
                                  Properties:
                                    AccessibleLabel: ="Month"
                                    Fill: =varBgLight
                                    Height: =34
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =["All", "April", "May", "June", "July", "August", "September", "October", "November", "December", "January", "February", "March"]
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: =Set(varActFilterMonth, ActMonthFilter_drp.Selected.Value)
                                    Width: =150
                              - ActStatusFilter_drp:
                                  Control: ModernDropdown@1.0.2
                                  Properties:
                                    AccessibleLabel: ="Status"
                                    Fill: =varBgLight
                                    Height: =34
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =["All", "Not Started", "Draft", "Submitted", "Approved", "Rejected"]
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: =Set(varActFilterStatus, ActStatusFilter_drp.Selected.Value)
                                    Width: =150
                              - ActResultCount_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    FillPortions: =1
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =12
                                    Text: =varActResultCount & " activities"
                                    Width: =Parent.Width
                        - ActTableHeader_con:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                            Children:
                              - ActHdrRAG_ico:
                                  Control: Circle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    DisabledFill: =RGBA(0, 120, 212, 1)
                                    Fill: =RGBA(0, 120, 212, 1)
                                    FocusedBorderThickness: =4
                                    Height: =Parent.Height
                                    HoverFill: =RGBA(0, 120, 212, 1)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PressedFill: =RGBA(0, 120, 212, 1)
                                    Width: =28
                              - ActHdrActivity_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    FillPortions: =3
                                    FontWeight: =FontWeight.Bold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingLeft: =4
                                    Size: =11
                                    Text: ="ACTIVITY"
                              - ActHdrFrequency_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Bold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =11
                                    Text: ="FREQUENCY"
                                    Width: =120
                              - ActHdrDue_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Bold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =11
                                    Text: ="DUE"
                              - ActHdrStatus_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    FillPortions: =0.8
                                    FontWeight: =FontWeight.Bold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =11
                                    Text: ="STATUS"
                                    Width: =130
                              - ActHdrAction_lbl:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Bold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =11
                                    Text: ="ACTION"
                                    Width: =130
                              - ActHdrChevron_ico:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Color: =RGBA(0, 0, 0, 0)
                                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                    DisabledColor: =RGBA(225, 223, 221, 1)
                                    DisabledFill: =RGBA(0, 0, 0, 0)
                                    FocusedBorderThickness: =4
                                    Height: =Parent.Height
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverColor: =RGBA(16, 110, 190, 1)
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    Icon: =Icon.ChevronRight
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                                    PressedColor: =RGBA(16, 110, 190, 1)
                                    PressedFill: =RGBA(0, 0, 0, 0)
                                    Width: =24
                        - ActGallery_con:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingLeft: =24
                              PaddingRight: =24
                              Width: =Parent.Width
                            Children:
                              - ActItems_gal:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
                                  Properties:
                                    BorderColor: =RGBA(245, 245, 245, 1)
                                    Items: |-
                                      =// ActItems_gal.Items — the joined activity+report status collection,
                                      // filtered by Status (FY/Month fixed in OnVisible) and the header search
                                      // box (matches activity name / code / programme).
                                      Filter(
                                          colMyActivityStatus,
                                          varActFilterStatus = "All" || ReportStatus = varActFilterStatus,
                                          IsBlank(MyActivitiesAppHeader.SearchText)
                                              || Lower(ActivityName) in Lower(MyActivitiesAppHeader.SearchText)
                                              || Lower(ProjectName) in Lower(MyActivitiesAppHeader.SearchText)
                                              || Lower(ProgrammeName) in Lower(MyActivitiesAppHeader.SearchText)
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    TemplateSize: =90
                                    Width: =Parent.Width
                                  Children:
                                    - ActRowFrequency_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AutoHeight: =true
                                          OnSelect: =
                                          Size: =10.5
                                          Text: =ThisItem.ActivityName
                                          Width: =250
                                          X: =40
                                          Y: =40
                                    - ActRowChevron_ico:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          Color: =RGBA(204, 204, 204, 1)
                                          DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                          DisabledColor: =RGBA(225, 223, 221, 1)
                                          DisabledFill: =RGBA(0, 0, 0, 0)
                                          FocusedBorderThickness: =4
                                          Height: =90
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =RGBA(16, 110, 190, 1)
                                          HoverFill: =RGBA(0, 0, 0, 0)
                                          Icon: =Icon.ChevronRight
                                          OnSelect: =Select(Parent)
                                          PressedBorderColor: =RGBA(0, 0, 0, 0)
                                          PressedColor: =RGBA(16, 110, 190, 1)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          Width: =24
                                          X: =1200
                                    - ActRowAction_btn:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          OnSelect: |-
                                            =// Navigate to report form / view based on the report status
                                            If(
                                                ThisItem.ReportStatus = "Not Started",
                                                Navigate(scr_ReportForm, ScreenTransition.Fade, {selectedActivityID: ThisItem.ActivityID}),
                                                ThisItem.ReportStatus = "Draft" || ThisItem.ReportStatus = "Rejected",
                                                Navigate(scr_ReportForm, ScreenTransition.Fade, {selectedActivityID: ThisItem.ActivityID, editReportID: ThisItem.ReportID}),
                                                ThisItem.ReportStatus = "Approved",
                                                Navigate(scr_ReportView, ScreenTransition.Fade, {viewReportID: ThisItem.ReportID}),
                                                Notify("This report has already been submitted.", NotificationType.Information)
                                            )
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Text: =ThisItem.ActionLabel
                                          Width: =130
                                          X: =1060
                                          Y: =30
                                    - ActRowStatus_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          FontWeight: =FontWeight.Bold
                                          OnSelect: =
                                          Size: =12
                                          Text: =ThisItem.ReportStatus
                                          Width: =100
                                          X: =930
                                          Y: =30
                                    - ActRowDue_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          OnSelect: =
                                          Size: =11.5
                                          Text: ="Day " & ThisItem.DueDay
                                          X: =300
                                          Y: =40
                                    - Text2:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Text: =CountRows( colMyActivities)
                                          X: =280
                                          Y: =40
                                    - ActRowProject_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          OnSelect: =Select(Parent)
                                          Size: =11.5
                                          Text: =ThisItem.ActivityName
                                          Width: =200
                                          X: =40
                                    - ActRowName_lbl:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          FontWeight: =FontWeight.Bold
                                          OnSelect: =Select(Parent)
                                          Size: =13.5
                                          Text: =ThisItem.ActivityName
                                          Width: =300
                                          X: =260
                                          Y: =40
                                    - ActRowRAG_rec2:
                                        Control: Circle@2.3.0
                                        Properties:
                                          BorderColor: =RGBA(245, 245, 245, 1)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          DisabledFill: =RGBA(0, 120, 212, 1)
                                          Fill: =RGBA(0, 120, 212, 1)
                                          Height: =13
                                          HoverFill: =RGBA(0, 120, 212, 1)
                                          PressedFill: =RGBA(0, 120, 212, 1)
                                          Width: =13
                                          X: =40
                                          Y: =40
