                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =13
                              Text: ="NW"
                              Width: =32
                        - MyaBrandText_con:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Height: =Parent.Height
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =Parent.Width - 62
                            Children:
                              - MyaBrandName_lbl:
                                  Control: Label@2.5.1
