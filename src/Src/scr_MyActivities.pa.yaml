                              - Mya_gal_Activities:
                                  Control: Gallery@2.15.0
                                  Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
                                  Properties:
                                    BorderColor: =RGBA(245, 245, 245, 1)
                                    Items: |-
                                      =// Mya_gal_Activities.Items — my activities joined live with their
                                      // latest report (current-FY set in colMyaReports), filtered by the
                                      // FY / quarter / month dropdowns and the search box. Counts on the
                                      // summary strip derive from this same filtered set (gallery.AllItems).
                                      Filter(
                                          AddColumns(
                                              colMyaActivities,
                                              "ActivityID", ThisRecord.ID,
                                              "ActivityName", Coalesce(ThisRecord.ActivityShortDescription, ThisRecord.Title),
                                              "ProjectName", Coalesce(ThisRecord.Project.Value, ""),
                                              "ProgrammeName", Coalesce(ThisRecord.ProgrammeLabel, ""),
                                              "DirectorateName", Coalesce(ThisRecord.DirectorateLabel, ""),
                                              "Frequency", Coalesce(ThisRecord.'Frequency ', ""),
                                              "DueDate", ThisRecord.DueDate,
                                              "RAG", If(
                                                  IsBlank(ThisRecord.DueDate), "Green",
                                                  ThisRecord.DueDate < Today(), "Red",
                                                  ThisRecord.DueDate <= DateAdd(Today(), 7, TimeUnit.Days), "Amber",
                                                  "Green"
                                              ),
                                              "ReportStatus", Coalesce(First(Filter(colMyaReports, Activity.Id = ThisRecord.ID)).Status.Value, "Not Started"),
                                              "ReportID", Coalesce(First(Filter(colMyaReports, Activity.Id = ThisRecord.ID)).ID, Blank()),
                                              "ReportMonth", Coalesce(
                                                  First(Filter(colMyaReports, Activity.Id = ThisRecord.ID)).ReportingMonth.Value,
                                                  Switch(Month(ThisRecord.DueDate), 4, "April", 5, "May", 6, "June", 7, "July", 8, "August", 9, "September", 10, "October", 11, "November", 12, "December", 1, "January", 2, "February", 3, "March", "")
                                              ),
                                              "RowQuarter", Coalesce(
                                                  First(Filter(colMyaReports, Activity.Id = ThisRecord.ID)).Quarter.Value,
                                                  Switch(Month(ThisRecord.DueDate), 4, "Q1", 5, "Q1", 6, "Q1", 7, "Q2", 8, "Q2", 9, "Q2", 10, "Q3", 11, "Q3", 12, "Q3", 1, "Q4", 2, "Q4", 3, "Q4", "")
                                              ),
                                              "ReportFY", Coalesce(First(Filter(colMyaReports, Activity.Id = ThisRecord.ID)).'FinancialYear '.Value, "")
                                          ),
                                          (varMyaFilterFY = "All" || IsBlank(ReportFY) || ReportFY = varMyaFilterFY),
                                          (varMyaFilterQuarter = "All Quarters" || RowQuarter = varMyaFilterQuarter),
                                          (varMyaFilterMonth = "All Months" || ReportMonth = varMyaFilterMonth),
                                          IsBlank(Mya_txt_Search.Text)
                                              || Lower(ActivityName) in Lower(Mya_txt_Search.Text)
                                              || Lower(ProjectName) in Lower(Mya_txt_Search.Text)
                                              || Lower(ProgrammeName) in Lower(Mya_txt_Search.Text)
                                              || Lower(DirectorateName) in Lower(Mya_txt_Search.Text)
                                      )
