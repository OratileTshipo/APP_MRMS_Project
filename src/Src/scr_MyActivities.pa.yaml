Screens:
  scr_MyActivities:
    Properties:
      Fill: =varBgGrey
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =// ============================================================
        // scr_MyActivities.OnVisible — v5 contributor worklist
        // Purpose: reset filters, then load this user's assigned
        // activities plus the current-FY report set used for the
        // per-row status join (gallery Items does the join live).
        // ============================================================
        Set(varMyaFilterFY, varCurrentFY);
        Set(varMyaFilterQuarter, "All Quarters");
        Set(varMyaFilterMonth, "All Months");
        ClearCollect(
            colMyaActivities,
            Filter(Activities, ActivityOwner.Email = varUserEmail, 'Active ' = true)
        );
        ClearCollect(
            colMyaReports,
            Filter(MonthlyReports, 'FinancialYear '.Value = varCurrentFY)
        )
