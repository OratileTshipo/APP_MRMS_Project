                                                FocusedBorderThickness: =4
                                                Height: =Parent.Height
                                                HoverFill: =RGBA(0, 0, 0, 0)
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                PressedFill: =RGBA(0, 0, 0, 0)
                                                Width: =10
                                          - ActRowStatus_lbl:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: ="Report status: " & ThisItem.ReportStatus
                                                Align: =Align.Center
                                                FillPortions: =1
                                                FontWeight: =FontWeight.Bold
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                PaddingLeft: =4
                                                Size: =12
                                                Text: =ThisItem.ReportStatus
                                          - Rectangle_sep7:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =2
                                                DisabledFill: =RGBA(161, 159, 157, 1)
                                                Fill: =RGBA(0, 0, 0, 0)
                                                FocusedBorderThickness: =4
                                                Height: =Parent.Height
                                                HoverFill: =RGBA(0, 0, 0, 0)
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                PressedFill: =RGBA(0, 0, 0, 0)
                                                Width: =10
                                          - ActRowAction_btn:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                OnSelect: |-
                                                  =If(
                                                      ThisItem.ReportStatus = "Not Started",
                                                      Navigate(scr_ReportForm, ScreenTransition.Fade, {selectedActivityID: ThisItem.ActivityID}),
                                                      ThisItem.ReportStatus = "Draft" || ThisItem.ReportStatus = "Rejected",
                                                      Navigate(scr_ReportForm, ScreenTransition.Fade, {selectedActivityID: ThisItem.ActivityID, editReportID: ThisItem.ReportID}),
                                                      ThisItem.ReportStatus = "Approved",
                                                      Navigate(scr_ReportView, ScreenTransition.Fade, {viewReportID: ThisItem.ReportID}),
                                                      Notify("This report has already been submitted.", NotificationType.Information)
                                                  )
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                Text: =ThisItem.ActionLabel
                                                Width: =130

