Screens:
  scr_MyActivities:
    Properties:
      Fill: =varBgLight
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =// ============================================================
        // scr_MyActivities.OnVisible — PRODUCTION VERSION
        // Purpose: initialise filter state and load user's assigned activities
        // with their latest report status for the current reporting period
        // ============================================================

        // 1. FILTER STATE — reset every visit
        Set(varActFilterFY, varCurrentFY);
        Set(varActFilterMonth, "All");
        Set(varActFilterStatus, "All");

        // 2. LOAD ACTIVITIES — role-scoped
        ClearCollect(
            colMyActivities,
            Switch(
                varUserRole,
                "Administrator",
                    Filter(Activities, 'Active ' = true),
                "DeputyDirectorME",
                    Filter(Activities, 'Active ' = true),
                "ProgrammeManager",
                    Filter(Activities, 'Active ' = true, ProgrammeLabel = varUserProgramme),
                "Supervisor",
                    Filter(Activities, 'Active ' = true, DirectorateLabel = varUserDirectorate),
                Filter(Activities, 'Active ' = true, DirectorateLabel = varUserDirectorate)
            )
        );

        // 3. LOAD REPORTS — role-scoped for the current FY
        ClearCollect(
            colMyReportsFY,
            Switch(
                varUserRole,
                "Administrator",
                    Filter(MonthlyReports, 'FinancialYear '.Value = varCurrentFY),
                "DeputyDirectorME",
                    Filter(MonthlyReports, 'FinancialYear '.Value = varCurrentFY),
                "ProgrammeManager",
                    Filter(MonthlyReports, 'FinancialYear '.Value = varCurrentFY, ProgrammeLabel = varUserProgramme),
                "Supervisor",
                    Filter(MonthlyReports, 'FinancialYear '.Value = varCurrentFY, DirectorateLabel = varUserDirectorate),
                Filter(MonthlyReports, 'FinancialYear '.Value = varCurrentFY, DirectorateLabel = varUserDirectorate)
            )
        );

        // 4. BUILD ACTIVITY STATUS — join each activity with its latest report
        ClearCollect(
            colMyActivityStatus,
            ForAll(
                colMyActivities As Act,
                With(
                    {
                        latestReport: First(
                            Filter(colMyReportsFY, Activity.Id = Act.ID)
                        )
                    },
                    {
                        ActivityID: Act.ID,
                        ActivityName: Act.ActivityShortDescription,
                        ProjectName: Act.Project.Value,
                        ProgrammeName: Act.ProgrammeLabel,
                        DirectorateName: Act.DirectorateLabel,
                        Frequency: Act.'Frequency ',
                        DueDay: Day(Act.DueDate),
                        ReportStatus: Coalesce(latestReport.ReportStatus.Value, "Not Started"),
                        ReportID: Coalesce(latestReport.ID, Blank()),
                        RAG: Switch(
                            Coalesce(latestReport.ReportStatus.Value, "Not Started"),
                            "Approved", "Green",
                            "Draft", "Amber",
                            "Submitted", "Amber",
                            "Rejected", "Red",
                            "Green"
                        ),
                        ActionLabel: Switch(
                            Coalesce(latestReport.ReportStatus.Value, "Not Started"),
                            "Not Started", "Start Report",
                            "Draft", "Continue",
                            "Submitted", "Submitted ✓",
                            "Rejected", "Resubmit",
                            "Approved", "View",
                            "Start Report"
                        ),
                        ActionDisabled: Coalesce(latestReport.ReportStatus.Value, "Not Started") = "Submitted",
                        IsOverdue: Coalesce(latestReport.IsOverdue, false),
                        IsFlagged: Coalesce(latestReport.isFlagged, false),
                        ActivityShortDescription: Act.ActivityShortDescription,
                        StartDate: Text(Act.StartDate, DateTimeFormat.ShortDate),
                        DueDate: Text(Act.DueDate, DateTimeFormat.ShortDate),
                        ActivityOwner: Text(Act.ActivityOwner.DisplayName),
                        ActivityStatus: Text(Act.Status.Value),
                        Project: Text(Act.Project.Value)
                    }
                )
            )
        );

        // 5. SET RESULT COUNT
        Set(varActResultCount, CountRows(colMyActivityStatus));

