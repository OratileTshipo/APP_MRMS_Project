                                          Fill: =varBgGrey
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          Height: =22
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          Size: =10.5
                                          Text: |-
                                            ="Project: " & ThisItem.ProjectName
                                          Width: =280
                                          X: =144
                                          Y: =60
                                    - MyaDue_lbl:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: |-
                                            =Switch(
                                                true,
                                                IsBlank(ThisItem.DueDate), varTextMid,
                                                ThisItem.DueDate < Today(), varRed,
                                                ThisItem.DueDate <= DateAdd(Today(), 7, TimeUnit.Days), varAmber,
                                                varTextDark
                                            )
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =12
                                          Text: |-
                                            =If(
                                                IsBlank(ThisItem.DueDate), "No due date",
                                                ThisItem.DueDate < Today(),
                                                    "Overdue — " & Text(ThisItem.DueDate, "d mmm"),
                                                ThisItem.DueDate = Today(),
                                                    "Due today",
                                                ThisItem.DueDate <= DateAdd(Today(), 7, TimeUnit.Days),
                                                    "Due in " & Max(1, RoundUp(DateDiff(Today(), ThisItem.DueDate, TimeUnit.Days), 0)) & " day" & If(Max(1, RoundUp(DateDiff(Today(), ThisItem.DueDate, TimeUnit.Days), 0)) = 1, "", "s"),
                                                "Due " & Text(ThisItem.DueDate, "d mmm")
                                            )
                                          Width: =170
                                          X: =480
                                          Y: =18
                                    - MyaMonth_lbl:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =varTextLight
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          Height: =18
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =11
                                          Text: |-
                                            ="Reporting month: " & ThisItem.ReportMonth
                                          Width: =170
                                          X: =480
                                          Y: =42
                                    - MyaStatus_lbl:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: |-
                                            =Switch(
                                                ThisItem.ReportStatus,
                                                "Draft", varAccent,
                                                "Rejected", varRed,
                                                "Submitted", varGreen,
                                                "Approved", varGold,
                                                varTextMid
                                            )
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          Fill: |-
                                            =Switch(
                                                ThisItem.ReportStatus,
                                                "Draft", varBlueBg,
                                                "Rejected", varRedBg,
                                                "Submitted", varGreenBg,
                                                "Approved", varAmberBg,
                                                varBgGrey
                                            )
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =26
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =11
                                          Text: =ThisItem.ReportStatus
                                          Width: =110
                                          X: =680
                                          Y: =20
                                    - MyaAction_lbl:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          BorderColor: |-
                                            =If(
                                                ThisItem.ReportStatus = "Rejected", RGBA(240, 201, 192, 1),
                                                ThisItem.ReportStatus = "Submitted" || ThisItem.ReportStatus = "Approved", varBorder,
                                                varAccent
                                            )
                                          BorderStyle: =BorderStyle.Solid
                                          BorderThickness: =1
                                          Color: |-
                                            =If(
                                                ThisItem.ReportStatus = "Rejected", varRed,
                                                ThisItem.ReportStatus = "Submitted" || ThisItem.ReportStatus = "Approved", varTextMid,
                                                RGBA(255, 255, 255, 1)
                                            )
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          Fill: |-
                                            =If(
                                                ThisItem.ReportStatus = "Submitted" || ThisItem.ReportStatus = "Approved", varCardBg,
                                                varAccent
                                            )
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =36
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Set(varMyaSelectedActivityID, ThisItem.ActivityID);
                                             Set(varMyaSelectedActivityName, ThisItem.ActivityName);
                                             Navigate(scr_MyReports, ScreenTransition.Fade)
                                          Size: =12.5
                                          Text: |-
                                            =If(
                                                ThisItem.ReportStatus = "Submitted" || ThisItem.ReportStatus = "Approved",
                                                "View →",
                                                "Report →"
                                            )
                                          Width: =120
                                          X: =810
                                          Y: =16
