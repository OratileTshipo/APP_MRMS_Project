App:
  Properties:
    OnStart: "=/*\r\n/ ============================================================\r\n// 1. THEME COLOURS\r\n// ============================================================\r\n\r\nSet(varNavy, ColorValue(\"#122952\"));\r\nSet(varBlue, ColorValue(\"#2E75B6\"));\r\nSet(varLBlue, ColorValue(\"#D9E6F2\"));\r\nSet(varGrey, ColorValue(\"#595959\"));\r\nSet(varGreen, ColorValue(\"#1E8A44\"));\r\nSet(varAmber, ColorValue(\"#E6A100\"));\r\nSet(varRed, ColorValue(\"#C0392B\"));\r\nSet(varBgLight, ColorValue(\"#F8F8F8\"));\r\n\r\n\r\n// ============================================================\r\n// 2. FILTER DEFAULTS\r\n// ============================================================\r\n\r\nSet(varHomeFilter, \"All\");\r\nSet(varHomeSearchTerm, \"\");\r\nSet(varFilterFY, \"All\");\r\nSet(varFilterProgramme, \"All\");\r\nSet(varFilterDirectorate, \"All\");\r\nSet(varFilterQuarter, \"All\");\r\n\r\n\r\n// ============================================================\r\n// 3. RESPONSIVE BREAKPOINTS\r\n// ============================================================\r\n\r\nSet(varIsMobile, App.Width < 640);\r\nSet(varIsTablet, App.Width >= 640 && App.Width < 1100);\r\n\r\n\r\n// ============================================================\r\n// 4. LOAD REFERENCE DATA\r\n// ============================================================\r\n\r\nConcurrent(\r\n    ClearCollect(\r\n        colProgrammes,\r\n        Filter(\r\n            Programmes,\r\n            Active = true\r\n        )\r\n    ),\r\n\r\n    ClearCollect(\r\n        colProjects,\r\n        Filter(\r\n            Projects,\r\n            Status.Value = \"Active\"\r\n        )\r\n    ),\r\n\r\n    ClearCollect(\r\n        colActivities,\r\n        Filter(\r\n            Activities,\r\n            'Active ' = true\r\n        )\r\n    ),\r\n\r\n    ClearCollect(\r\n        colKPIDefinitions,\r\n        KPIDefinitions\r\n    ),\r\n\r\n    ClearCollect(\r\n        colDirectorates,\r\n        Filter(\r\n            Directorates,\r\n            Active = true\r\n        )\r\n    )\r\n);\r\n\r\n\r\n// ============================================================\r\n// 5. CURRENT USER\r\n// ============================================================\r\n\r\nSet(\r\n    varCurrentUserRecord,\r\n    LookUp(\r\n        APP_Users,\r\n        UserAccount.Email = User().Email\r\n    )\r\n);\r\n\r\nSet(\r\n    varUserEmail,\r\n    User().Email\r\n);\r\n\r\nSet(\r\n    varUserFullName,\r\n    User().FullName\r\n);\r\n\r\nSet(\r\n    varUserRole,\r\n    varCurrentUserRecord.Role.Value\r\n);\r\n\r\n\r\n// Programme lookup record\r\nSet(\r\n    varUserProgramme,\r\n    varCurrentUserRecord.Programme\r\n);\r\n\r\nSet(\r\n    varUserProgrammeID,\r\n    varCurrentUserRecord.Programme.Id\r\n);\r\n\r\n\r\n// Directorate lookup record\r\nSet(\r\n    varUserDirectorate,\r\n    varCurrentUserRecord.Directorate\r\n);\r\n\r\nSet(\r\n    varUserDirectorateID,\r\n    varCurrentUserRecord.Directorate.Id\r\n);\r\n\r\n\r\n\r\n// Report permissions\r\nSet(\r\n    varCanViewAllReports,\r\n    varUserRole = \"DeputyDirectorME\" ||\r\n    varUserRole = \"Administrator\"\r\n);\r\n\r\n\r\n// ============================================================\r\n// 6. NOTIFICATIONS\r\n// ============================================================\r\n\r\nClearCollect(\r\n    colMyNotifications,\r\n    Filter(\r\n        Notifications,\r\n        RecipientUser.Email = User().Email &&\r\n        IsRead = false\r\n    )\r\n);\r\n\r\nSet(\r\n    varUnreadCount,\r\n    CountRows(colMyNotifications)\r\n);\r\n\r\n\r\n// ============================================================\r\n// 7. FINANCIAL YEAR\r\n// ============================================================\r\n\r\nSet(\r\n    varCurrentFY,\r\n    If(\r\n        Month(Today()) >= 4,\r\n        Text(Year(Today())) &\r\n        \"/\" &\r\n        Text(\r\n            Mod(Year(Today()) + 1, 100),\r\n            \"00\"\r\n        ),\r\n        Text(Year(Today()) - 1) &\r\n        \"/\" &\r\n        Text(\r\n            Mod(Year(Today()), 100),\r\n            \"00\"\r\n        )\r\n    )\r\n);\r\n\r\n\r\n// ============================================================\r\n// 8. CURRENT MONTH\r\n// ============================================================\r\n\r\nSet(\r\n    varCurrentMonth,\r\n    Switch(\r\n        Month(Today()),\r\n        1, \"January\",\r\n        2, \"February\",\r\n        3, \"March\",\r\n        4, \"April\",\r\n        5, \"May\",\r\n        6, \"June\",\r\n        7, \"July\",\r\n        8, \"August\",\r\n        9, \"September\",\r\n        10, \"October\",\r\n        11, \"November\",\r\n        12, \"December\"\r\n    )\r\n);\r\n\r\n\r\n// ============================================================\r\n// 9. CURRENT QUARTER\r\n// ============================================================\r\n\r\nSet(\r\n    varCurrentQuarter,\r\n    Switch(\r\n        true,\r\n        Month(Today()) >= 4 &&\r\n        Month(Today()) <= 6,\r\n        \"Q1 (Apr-Jun)\",\r\n\r\n        Month(Today()) >= 7 &&\r\n        Month(Today()) <= 9,\r\n        \"Q2 (Jul-Sep)\",\r\n\r\n        Month(Today()) >= 10 &&\r\n        Month(Today()) <= 12,\r\n        \"Q3 (Oct-Dec)\",\r\n\r\n        \"Q4 (Jan-Mar)\"\r\n    )\r\n);\r\n\r\n\r\n// ============================================================\r\n// 10. DATE\r\n// ============================================================\r\n\r\nSet(\r\n    varTodaysDate,\r\n    Today()\r\n);\r\n\r\n\r\n// ============================================================\r\n// 11. UI STATE\r\n// ============================================================\r\n\r\nSet(varNavOpen, false);\r\nSet(varSidePanelOpen, false);\r\nSet(varFormIsValid, false);\r\n\r\n*/\r\n\r\n// 1. Theme colours\r\nSet(varNavy, ColorValue(\"#122952\"));\r\nSet(varBlue, ColorValue(\"#2E75B6\"));\r\nSet(varLBlue, ColorValue(\"#D9E6F2\"));\r\nSet(varGrey, ColorValue(\"#595959\"));\r\nSet(varGreen, ColorValue(\"#1E8A44\"));\r\nSet(varAmber, ColorValue(\"#E6A100\"));\r\nSet(varRed, ColorValue(\"#C0392B\"));\r\nSet(varBgLight, ColorValue(\"#F8F8F8\"));\r\n\r\n// Filters\r\nSet(varHomeFilter, \"All\");\r\nSet(varHomeSearchTerm, \"\");\r\nSet(varFilterFY, \"All\");\r\nSet(varFilterProgramme, \"All\");\r\nSet(varFilterDirectorate, \"All\");\r\nSet(varFilterQuarter, \"All\");\r\n \r\n// 2. Responsive breakpoints\r\nSet(varIsMobile, App.Width < 640);\r\nSet(varIsTablet, App.Width >= 640 And App.Width < 1100);\r\n \r\n// 3. Load reference collections\r\nConcurrent(\r\n    ClearCollect(colProgrammes, Filter(Programmes, Active = true)),\r\n    ClearCollect(colProjects, Filter(Projects, Status.Value = \"Active\")),\r\n    ClearCollect(colActivities, Filter(Activities, 'Active ' = true)),\r\n   // ClearCollect(colKPIDefinitions, KPIDefinitions),\r\n    ClearCollect(colDirectorates, Filter(Directorates, Active = true))\r\n);\r\n \r\n// 4. Resolve current user role\r\nSet(varUserEmail, User().Email);\r\nSet(varUserFullName, User().FullName);\r\n\r\nSet(varCurrentUserRecord,\r\n    LookUp(APP_Users, UserAccount.Email = varUserEmail)\r\n);\r\n\r\nSet(varUserRole, varCurrentUserRecord.Role.Value);\r\nSet(varUserDirectorate, varCurrentUserRecord.Directorate.Value);\r\nSet(varUserProgramme, varCurrentUserRecord.Programme.Value);\r\nSet(varUserDirectorateID, LookUp(Directorates, Title = varUserDirectorate).DirectorateID);\r\n\r\nSet(varCanViewAllReports, varUserRole = \"DeputyDirectorME\" || varUserRole = \"Administrator\");\r\n \r\n// 5. Notifications\r\nClearCollect(colMyNotifications,\r\n    Filter(Notifications, RecipientUser.Email = User().Email, IsRead = false));\r\nSet(varUnreadCount, CountRows(colMyNotifications));\r\n \r\n// 6. Financial year / period defaults\r\nSet(varCurrentFY,\r\n    If(\r\n        Month(Today()) >= 4,\r\n        Year(Today()) & \"/\" & Right(Year(Today()) + 1, 2),\r\n        Year(Today()) - 1 & \"/\" & Right(Year(Today()), 2)\r\n    )\r\n);\r\nSet(varCurrentMonth,\r\n    Switch(Month(Today()),\r\n        4,\"April\", 5,\"May\", 6,\"June\", 7,\"July\", 8,\"August\", 9,\"September\",\r\n        10,\"October\", 11,\"November\", 12,\"December\", 1,\"January\", 2,\"February\", 3,\"March\"));\r\nSet(varCurrentQuarter,\r\n    Switch(true,\r\n        Month(Today()) >= 4 And Month(Today()) <= 6, \"Q1 (Apr-Jun)\",\r\n        Month(Today()) >= 7 And Month(Today()) <= 9, \"Q2 (Jul-Sep)\",\r\n        Month(Today()) >= 10 And Month(Today()) <= 12, \"Q3 (Oct-Dec)\",\r\n        \"Q4 (Jan-Mar)\"));\r\nSet(varTodaysDate, DateValue(Today()));\r\n \r\n// 7. UI state defaults\r\nSet(varNavOpen, false);\r\nSet(varSidePanelOpen, false);\r\nSet(varFormIsValid, false);"
    StartScreen: =scr_Splash
    Theme: =PowerAppsTheme
